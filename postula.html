<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zubale – Postula y empieza a ganar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:        #1557D6;
      --blue2:       #1B4FFF;
      --blue-light:  #DBEAFE;
      --blue-dark:   #0A1A6B;
      --blue-deeper: #0B3BAA;
      --gray:        #F3F6FA;
      --gray2:       #E5E7EB;
      --text:        #1A2340;
      --muted:       #6B7A9A;
      --white:       #FFFFFF;
      --success:     #10B981;
      --green-soft:  #D1FAE5;
      --warn-bg:     #FEF9C3;
      --warn-border: #FDE047;
      --warn-text:   #854D0E;
    }

    input, button, select, textarea { font-family: 'Lexend', 'Segoe UI', system-ui, sans-serif; }
    html, body {
      height: 100%;
      font-family: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--gray);
      color: var(--text);
      scroll-behavior: smooth;
    }
    #root { min-height: 100vh; }

    /* ── HEADER ── */
    .header {
      background: var(--white);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      box-shadow: 0 1px 0 var(--gray2);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-logo { display: flex; align-items: center; }
    .header-cta {
      background: var(--blue-light);
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 99px;
      border: 1px solid #BFDBFE;
      cursor: pointer;
      transition: all 0.2s;
    }
    .header-cta:hover { background: var(--blue); color: var(--white); }

    /* ── HERO (role selector) ── */
    .hero {
      background: linear-gradient(135deg, #1557D6 0%, #1B4FFF 60%, #2A68FF 100%);
      color: var(--white);
      padding: 56px 24px 64px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
      top: -200px; left: -200px;
      pointer-events: none;
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      bottom: -200px; right: -200px;
      pointer-events: none;
    }
    .hero-inner { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; }
    .hero h1 {
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 900;
      margin-bottom: 10px;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }
    .hero p {
      font-size: clamp(14px, 2vw, 17px);
      opacity: 0.9;
      max-width: 580px;
      margin: 0 auto 32px;
      line-height: 1.55;
    }

    /* ── ROLE PILLS ── */
    .role-pills {
      display: inline-flex;
      gap: 10px;
      padding: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 99px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    @media (max-width: 560px) {
      .role-pills { flex-wrap: wrap; justify-content: center; border-radius: 24px; }
    }
    .role-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 32px;
      border-radius: 99px;
      font-size: 15px;
      font-weight: 800;
      color: var(--white);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(.4,0,.2,1);
      letter-spacing: 0.3px;
      min-width: 120px;
    }
    .role-pill:hover { background: rgba(255,255,255,0.14); }
    .role-pill.active {
      background: var(--white);
      color: var(--blue);
      box-shadow: 0 6px 22px rgba(0,0,0,0.18);
      transform: scale(1.02);
    }

    /* ── MAIN CONTENT ── */
    .main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px 60px;
      position: relative;
      z-index: 5;
    }

    /* ── TIMELINE CARD ── */
    .timeline-card {
      max-width: 1100px;
      margin: 10px auto 32px;
      padding: 0 20px;
      position: relative;
      z-index: 2;
    }
    .timeline-card-inner {
      background: var(--white);
      border-radius: 20px;
      padding: 28px 32px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .timeline-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 24px;
    }
    .timeline-track {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 6px 30px 0 6px;
    }
    .timeline-track::before {
      content: "";
      position: absolute;
      top: 26px;
      left: 40px;
      right: 22px;
      height: 3px;
      background: linear-gradient(90deg, var(--blue-light), var(--blue));
      border-radius: 2px 0 0 2px;
      z-index: 0;
    }
    .tl-node {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      cursor: pointer;
      min-width: 0;
    }
    .tl-dot {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--white);
      border: 2.5px solid var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      flex-shrink: 0;
    }
    .tl-dot svg {
      width: 18px; height: 18px;
      stroke: var(--blue);
      fill: none;
      transition: stroke 0.2s;
    }
    .tl-node:hover .tl-dot {
      transform: scale(1.08);
      box-shadow: 0 0 0 4px rgba(21,87,214,0.08);
    }
    .tl-node.active .tl-dot {
      background: var(--blue);
      border-color: var(--blue);
      transform: scale(1.15);
      box-shadow: 0 0 0 6px rgba(21,87,214,0.15);
    }
    .tl-node.active .tl-dot svg { stroke: var(--white); }
    .tl-label {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      line-height: 1.3;
      max-width: 100px;
      transition: color 0.2s;
    }
    .tl-node.active .tl-label { color: var(--blue); }
    /* Detail panel below track */
    .tl-detail {
      margin-top: 20px;
      padding: 18px 22px;
      background: var(--gray);
      border-radius: 14px;
      animation: fadeSlideIn 0.25s ease;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tl-detail-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .tl-detail-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    .tl-detail .app-btns {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .tl-detail .app-btns a img {
      height: 38px;
      border-radius: 6px;
    }
    /* Arrow at end of timeline line */
    .tl-arrow {
      position: absolute;
      top: 20px;
      right: 10px;
      width: 0; height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 12px solid var(--blue);
      z-index: 1;
    }
    /* Action buttons in detail panel */
    .tl-detail-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .tl-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--blue);
      background: var(--white);
      color: var(--blue);
      font-family: 'Lexend', sans-serif;
      transition: all 0.2s;
    }
    .tl-action-btn:hover {
      background: var(--blue-light);
    }
    .tl-action-btn svg {
      width: 18px; height: 18px;
      flex-shrink: 0;
    }
    .tl-action-video {
      background: #FF0000;
      color: var(--white);
      border-color: #FF0000;
    }
    .tl-action-video:hover {
      background: #CC0000;
    }
    .tl-action-video svg {
      fill: var(--white);
    }
    @media (max-width: 640px) {
      .timeline-card-inner { padding: 20px 10px 18px; }
      .timeline-track {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        justify-content: flex-start;
        gap: 0;
        padding: 0 40px 10px 6px;
        scrollbar-width: none;
      }
      .timeline-track::-webkit-scrollbar { display: none; }
      .timeline-track::before {
        left: 20px;
        right: 30px;
      }
      .tl-node {
        flex: 0 0 auto;
        min-width: 80px;
      }
      .tl-label { font-size: 10px; max-width: 72px; }
      .tl-dot { width: 36px; height: 36px; }
      .tl-dot svg { width: 16px; height: 16px; }
      .tl-arrow { top: 16px; right: 14px; border-left-width: 10px; border-top-width: 6px; border-bottom-width: 6px; }
      .tl-detail { padding: 14px 16px; }
      .tl-action-btn { font-size: 12px; padding: 8px 12px; }
      .tl-detail .app-btns a img { height: 34px; }
    }

    /* SPLIT CONTENT */
    .split-wrap {
      display: grid;
      grid-template-columns: 1.55fr minmax(320px, 1fr);
      gap: 22px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .split-wrap { grid-template-columns: 1fr; }
    }

    /* ── LEFT: "Dónde puedes ser X" ── */
    .locations-card {
      background: linear-gradient(160deg, #0B3BAA 0%, #1557D6 55%, #1B4FFF 100%);
      color: var(--white);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(21,87,214,0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 420px;
      cursor: pointer;
      transition: transform 0.28s cubic-bezier(.4,0,.2,1), box-shadow 0.28s;
    }
    .locations-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 26px 60px rgba(21,87,214,0.35);
    }
    .locations-card::before {
      content: "";
      position: absolute;
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none;
    }
    .locations-card::after {
      content: "";
      position: absolute;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      bottom: -60px; left: -60px;
      pointer-events: none;
    }
    .loc-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
      width: fit-content;
    }
    .loc-title {
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 900;
      line-height: 1.15;
      margin: 18px 0 10px;
      position: relative;
      z-index: 2;
    }
    .loc-sub {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.6;
      margin-bottom: 26px;
      position: relative;
      z-index: 2;
      max-width: 320px;
    }
    .loc-mini-list {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 26px;
    }
    .loc-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0.9;
    }
    .loc-mini-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #8FD7FF;
      box-shadow: 0 0 0 3px rgba(143,215,255,0.25);
    }
    .loc-cta {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--white);
      color: var(--blue);
      padding: 16px 22px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      width: 100%;
    }
    .loc-cta:hover { transform: scale(1.02); }
    .loc-cta-icon {
      display: inline-flex;
      width: 26px; height: 26px;
      background: var(--blue-light);
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* ── RIGHT: Info grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .info-card {
      background: var(--white);
      border-radius: 20px;
      padding: 26px 28px;
      box-shadow: 0 6px 22px rgba(21,87,214,0.08);
      border: 1.5px solid transparent;
      transition: all 0.28s cubic-bezier(.4,0,.2,1);
      position: relative;
      overflow: hidden;
    }
    .info-card:hover {
      border-color: var(--blue-light);
      box-shadow: 0 14px 36px rgba(21,87,214,0.15);
      transform: translateY(-2px);
    }
    .info-card-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .info-card-icon {
      width: 46px; height: 46px;
      border-radius: 13px;
      background: var(--blue-light);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .info-card-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }
    .info-card p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }
    .info-card ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .info-card li {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5;
    }
    .info-card li::before {
      content: "✓";
      flex-shrink: 0;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--green-soft);
      color: var(--success);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      margin-top: 1px;
    }

    /* Earnings specific */
    .earn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--gray);
      border-radius: 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .earn-row:hover { background: var(--blue-light); }
    .earn-label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .earn-value { font-size: 17px; font-weight: 900; color: var(--blue); }
    .earn-note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
      font-style: italic;
      opacity: 0.75;
    }

    /* ── GUÍAS CARD (en info-grid, estilo blanco como .info-card) ── */
    .guias-card {
      position: relative;
      background: var(--white);
      color: var(--text);
      border-radius: 20px;
      padding: 26px 28px;
      box-shadow: 0 6px 22px rgba(21,87,214,0.08);
      border: 1.5px solid transparent;
      transition: all 0.28s cubic-bezier(.4,0,.2,1);
      overflow: hidden;
      cursor: pointer;
    }
    .guias-card:hover {
      border-color: var(--blue-light);
      box-shadow: 0 14px 36px rgba(21,87,214,0.15);
      transform: translateY(-2px);
    }
    .guias-card-bg { display: none; }
    .guias-card-content { position: relative; z-index: 2; }
    .guias-card-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .guias-card-icon {
      width: 46px; height: 46px;
      border-radius: 13px;
      background: var(--blue-light);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .guias-card-tag {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--blue);
      margin-bottom: 3px;
    }
    .guias-card-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }
    .guias-card-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .guias-card-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 16px;
      background: var(--blue-light);
      color: var(--blue);
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .guias-card-btn:hover {
      background: var(--blue);
      color: var(--white);
      transform: translateX(2px);
      box-shadow: 0 6px 16px rgba(21,87,214,0.22);
    }

    /* ── GUÍAS MODAL ── */
    .guias-overlay { z-index: 240; }
    .guias-modal {
      background: var(--white);
      border-radius: 24px;
      width: 100%;
      max-width: 860px;
      max-height: 94vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 28px 70px rgba(0,0,0,0.35);
      animation: slideUp 0.32s cubic-bezier(.4,0,.2,1);
    }
    .guias-head {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: var(--white);
      padding: 22px 28px 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .guias-head-text { flex: 1; min-width: 0; }
    .guias-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: rgba(255,255,255,0.22);
      padding: 4px 11px;
      border-radius: 99px;
      margin-bottom: 8px;
    }
    .guias-title {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .guias-sub {
      font-size: 13px;
      opacity: 0.88;
      line-height: 1.45;
    }
    .guias-stage {
      position: relative;
      background: #0B3BAA;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 58px;
      min-height: 300px;
    }
    .guias-slide-wrap {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .guias-slide {
      width: 100%;
      height: auto;
      max-height: 62vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.4);
      display: block;
    }
    .guias-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.95);
      color: var(--blue);
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      z-index: 3;
    }
    .guias-nav.prev { left: 14px; }
    .guias-nav.next { right: 14px; }
    .guias-nav:hover:not(.disabled) {
      background: var(--white);
      transform: translateY(-50%) scale(1.08);
    }

    /* ── MODAL OVERLAY ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(10,26,107,0.55);
      backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
      overscroll-behavior: contain;
      overflow-y: auto;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-locations {
      background: var(--white);
      border-radius: 24px;
      width: 100%;
      max-width: 1360px;
      max-height: 94vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 28px 70px rgba(0,0,0,0.3);
      animation: slideUp 0.32s cubic-bezier(.4,0,.2,1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-head {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);

      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);

      color: var(--white);
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .modal-close:hover { background: rgba(255,255,255,0.3); transform: rotate(90deg); }

    .modal-search-row {
      padding: 20px 28px 8px;

      gap: 12px;
      align-items: center;
      background: var(--white);

      .modal-search-row { grid-template-columns: 1fr; }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border: 2px solid var(--gray2);
      border-radius: 14px;
      background: var(--white);
      transition: all 0.2s;
      padding-left: 14px;

    .search-wrap:focus-within {
      border-color: var(--blue);

    .search-wrap svg { flex-shrink: 0; color: var(--muted); }
    .search-wrap input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 14px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);

      border-color: var(--blue);
      box-shadow: 0 6px 20px rgba(21,87,214,0.12);
      transform: translateX(3px);
    }
    .store-row-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .store-row-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--blue-light);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .store-row-main {
      flex: 1;
      min-width: 0;
    }
    .store-row-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      overflow-wrap: break-word;
      hyphens: auto;
      padding-top: 2px;
    }
    .store-row-addr {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 3px;
      line-height: 1.45;
      overflow-wrap: break-word;
    }
    .store-row-maplink {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      background: var(--blue-light);
      border: none;
      color: var(--blue);
      font-size: 11.5px;
      font-weight: 800;
      padding: 5px 11px 5px 9px;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.2s;
      line-height: 1.2;
    }
    .store-row-maplink:hover {
      background: var(--blue);
      color: var(--white);
      transform: translateY(-1px);
    }
    .store-row-maplink svg { flex-shrink: 0; }
    .store-row-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--gray);
      border: none;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      height: fit-content;
      margin-top: 4px;
      white-space: nowrap;
    }
    .store-row-toggle:hover { background: var(--blue-light); }
    .store-row-toggle .chev {
      display: inline-block;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      font-size: 10px;
    }
    .store-row-toggle.open .chev { transform: rotate(180deg); }

    .store-row-expand {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(.4,0,.2,1), margin-top 0.3s;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .store-row-expand.open {
      max-height: 220px;
      margin-top: 14px;
    }
    .tarifa-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: var(--white);
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 18px rgba(21,87,214,0.3);
      flex: 1 1 auto;
      justify-content: center;
      line-height: 1.2;
      white-space: nowrap;
    }
    .tarifa-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(21,87,214,0.4); }

    /* ── MAP COLUMN ── */
    .map-col {
      position: relative;
      background: var(--gray);
      border-left: 1px solid var(--gray2);
      overflow: hidden;
    }
    .map-col .leaflet-container {
      width: 100%;
      height: 100%;
      font-family: 'Lexend', sans-serif;
      background: #e5ecf5;
    }
    .map-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 500;
      background: var(--white);
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 99px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    /* Custom Leaflet marker */
    .zbl-marker-wrap {
      position: relative;
      width: 38px;
      height: 46px;
    }
    .zbl-marker {
      position: absolute;
      top: 0; left: 0;
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 6px 18px rgba(21,87,214,0.45);
      border: 3px solid var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(.4,0,.2,1);
    }
    .zbl-marker-inner {
      transform: rotate(45deg);
      font-size: 16px;
    }
    .zbl-marker-wrap:hover .zbl-marker,
    .zbl-marker-wrap.active .zbl-marker {
      transform: rotate(-45deg) scale(1.15);
    }
    .zbl-marker-wrap.active .zbl-marker {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      box-shadow: 0 8px 22px rgba(16,185,129,0.5);
    }

    /* Leaflet popup override */
    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      padding: 2px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2) !important;
    }
    .leaflet-popup-content {
      margin: 14px 16px !important;
      font-family: 'Lexend', sans-serif !important;
      min-width: 200px;
    }
    .leaflet-popup-tip { box-shadow: 0 10px 30px rgba(0,0,0,0.2) !important; }
    .popup-store-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .popup-store-addr {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .popup-inscribirme {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: var(--white) !important;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Lexend', sans-serif;
      text-align: center;
      text-decoration: none;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(21,87,214,0.3);
    }
    .popup-inscribirme:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(21,87,214,0.4);
    }
    .popup-tarifa-btn {
      display: block;
      width: 100%;
      background: rgba(91,33,182,0.08);
      color: var(--blue);
      border: 1.5px solid var(--blue);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Lexend', sans-serif;
      text-align: center;
      margin-bottom: 6px;
      transition: all 0.2s;
    }
    .popup-tarifa-btn:hover {
      background: var(--blue);
      color: var(--white);
    }
    .popup-tarifa-link {
      display: block;
      margin-top: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      cursor: pointer;
      text-decoration: underline;
    }

    /* Inscribirme button (store row) */
    .inscribirme-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: var(--white);
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 18px rgba(16,185,129,0.35);
      flex: 1 1 auto;
      justify-content: center;
      text-decoration: none;
      text-align: center;
      line-height: 1.2;
    }
    .inscribirme-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(16,185,129,0.45);
    }

    .store-row.selected {
      border-color: #10B981;
      background: #ECFDF5;
      box-shadow: 0 6px 18px rgba(16,185,129,0.15);
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 40px; margin-bottom: 10px; }
    .empty-title { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .empty-text { font-size: 13px; }

    /* ── TARIFAS MODAL (imagen desde Drive) ── */
    .tarifa-modal-img {
      width: 95vw;
      max-width: 700px;
      animation: slideUp 0.32s cubic-bezier(.4,0,.2,1);
      filter: drop-shadow(0 28px 40px rgba(0,0,0,0.25));
    }
    .tarifa-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--blue);
      border-radius: 20px 20px 0 0;
      gap: 12px;
    }
    .tarifa-modal-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--white);
    }
    .tarifa-close-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: none;
      color: var(--white);
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .tarifa-close-btn:hover { background: rgba(255,255,255,0.35); transform: rotate(90deg); }
    .tarifa-img-wrap {
      position: relative;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      border-radius: 0 0 20px 20px;
      overflow: hidden;
    }
    .tarifa-iframe {
      width: 100%;
      height: 75vh;
      max-height: 700px;
      border: none;
      display: block;
      transition: opacity 0.3s;
    }
    .tarifa-loading {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
    }
    /* Mobile: tarifa modal fullscreen */
    @media (max-width: 640px) {
      .tarifa-modal-img {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
      .tarifa-iframe {
        height: calc(100vh - 60px);
        max-height: none;
      }
      .tarifa-modal-head {
        padding: 12px 16px;
      }
      .tarifa-modal-title {
        font-size: 15px;
      }
      .tarifa-overlay {
        padding: 0;
      }
    }

    /* ── VER TARIFAS BUTTON ── */
    .ver-tarifas-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1.5px solid var(--blue);
      background: rgba(91,33,182,0.06);
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ver-tarifas-btn:hover {
      background: var(--blue);
      color: var(--white);
    }
    .store-row-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      width: 100%;
    }

    /* ── SHEET LOADING / ERROR ── */
    .sheet-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 48px 20px;
      font-size: 14px;
      color: var(--muted);
    }
    .sheet-error {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      font-size: 14px;
      color: #b91c1c;
      background: #fef2f2;
      border-radius: 10px;
      margin: 12px 16px;
    }

    /* Fade in classes for animations */
    .fade-in {
      animation: fadeInUp 0.4s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger-1 { animation-delay: 0.05s; }
    .stagger-2 { animation-delay: 0.12s; }
    .stagger-3 { animation-delay: 0.20s; }

    /* ── Video card ── */
    .video-card {
      background: var(--white);
      border-radius: 18px;
      box-shadow: 0 2px 12px rgba(21,87,214,0.07);
      overflow: hidden;
    }
    .video-card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 14px;
    }
    .video-card-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #FF0000 0%, #CC0000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      font-weight: 900;
    }
    .video-card-title { font-size: 16px; font-weight: 800; color: var(--text); }
    .video-card-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .video-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      background: #0a0a0a;
    }
    .video-embed iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .video-thumb-link {
      display: block;
      position: relative;
      width: 100%;
      border-radius: 0 0 16px 16px;
      overflow: hidden;
      cursor: pointer;
    }
    .video-thumb-img {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    .video-thumb-play {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px;
      background: rgba(255,0,0,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }
    .video-thumb-link:hover .video-thumb-play {
      transform: translate(-50%, -50%) scale(1.12);
    }
    /* ── VIDEO PLAYER MODAL ── */
    .video-overlay { z-index: 310; }
    .video-modal {
      width: 95vw;
      max-width: 800px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      animation: slideUp 0.3s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 28px 70px rgba(0,0,0,0.5);
    }
    .video-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--blue);
      gap: 12px;
    }
    .video-modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--white);
    }
    .video-modal-body {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
    }
    .video-modal-body iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    @media (max-width: 640px) {
      .video-modal {
        width: 100vw;
        max-width: 100vw;
        border-radius: 0;
      }
      .video-overlay { padding: 0; align-items: center; }
    }
    .video-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: rgba(255,255,255,0.7);
      gap: 10px;
    }
    .video-placeholder-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 2px solid rgba(255,255,255,0.15);
    }
    .video-placeholder-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .video-placeholder-sub {
      font-size: 11px;
      opacity: 0.5;
    }

    /* Footer */
    .footer { text-align: center; padding: 26px 20px; color: var(--muted); font-size: 12px; }

    /* ── CHATBOT WIDGET ── */
    .chat-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 600;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: #fff;
      border: none;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(21,87,214,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }
    .chat-fab:hover { transform: scale(1.08); box-shadow: 0 12px 36px rgba(21,87,214,0.55); }
    .chat-fab.open { border-radius: 14px; }

    .chat-window {
      position: fixed;
      bottom: 96px;
      right: 24px;
      z-index: 500;
      width: 380px;
      max-height: 520px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 60px rgba(21,87,214,0.25), 0 0 0 1px rgba(21,87,214,0.08);
      overflow: hidden;
      animation: chatSlideUp 0.3s cubic-bezier(.4,0,.2,1);
    }
    @keyframes chatSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .chat-header {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: #fff;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .chat-header-info { flex: 1; }
    .chat-header-name { font-weight: 800; font-size: 14px; }
    .chat-header-status { font-size: 11px; opacity: 0.8; }
    .chat-header-close {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .chat-header-close:hover { background: rgba(255,255,255,0.3); }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 260px;
      max-height: 340px;
      background: #f8faff;
    }

    .chat-msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }
    .chat-msg.bot {
      align-self: flex-start;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--gray2);
      border-bottom-left-radius: 4px;
    }
    .chat-msg.bot strong { font-weight: 600; }
    .chat-msg.bot ul { margin: 4px 0 4px 16px; padding: 0; }
    .chat-msg.bot li { margin-bottom: 3px; }
    .chat-msg.bot a { color: var(--blue); text-decoration: underline; font-weight: 500; }
    .chat-msg.bot a:hover { color: var(--blue-dark); }
    .chat-msg.bot p { margin: 0 0 6px 0; }
    .chat-msg.bot p:last-child { margin-bottom: 0; }
    .chat-msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat-msg.typing {
      align-self: flex-start;
      background: #fff;
      border: 1px solid var(--gray2);
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 4px;
      padding: 14px 18px;
    }
    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      opacity: 0.4;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid var(--gray2);
      background: #fff;
    }
    .chat-input-row input {
      flex: 1;
      border: 1.5px solid var(--gray2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-family: 'Lexend', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .chat-input-row input:focus { border-color: var(--blue); }
    .chat-input-row button {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--blue);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;

const GAS_URL = "https://script.google.com/macros/s/AKfycbyznjxIn99mewSPEBf3rEMMsI_7mGneJo5rf3HT9gk_HhdKweUSM0m5vSgVHKKkN3gE/exec";

/* Extrae el file ID de un link de Drive y devuelve la URL de preview (funciona en iframe) */
function driveToPreviewUrl(link) {
  if (!link) return null;
  const s = String(link).trim();
  if (!s) return null;
  let m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  if (s.startsWith("http")) return s;
  return null;
}

/* Extrae file ID de Drive y devuelve URL directa de imagen en alta calidad */
function driveToDirectImageUrl(link) {
  if (!link) return null;
  const s = String(link).trim();
  if (!s) return null;
  let m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (!m) m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://lh3.googleusercontent.com/d/${m[1]}=s1600`;
  if (s.startsWith("http")) return s;
  return null;
}

function getRegionCenter(regionName) {
  const clean = regionName.toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/^(v+i*|iv|ix|x+i*|xi+|[0-9]+)\s+region\s+(de(l)?\s+)?/i, "")
    .replace(/region\s+(de(l)?\s+)?/i, "")
    .trim();
  for (const [k, v] of Object.entries(REGION_CENTERS)) {
    const kn = k.normalize("NFD").replace(/[̀-ͯ]/g, "");
    if (clean.includes(kn) || kn.includes(clean)) return v;
  }
  return { center: [-33.45, -70.67], zoom: 10 };
}

/* Encuentra la key del header que contenga el substring (case-insensitive) */
function findKey(obj, ...needles) {
  const keys = Object.keys(obj);
  for (const needle of needles) {
    const found = keys.find(k => k.toLowerCase().includes(needle));
    if (found) return found;
  }
  return null;
}

/* Fetch desde Google Apps Script → estructura REGIONES agrupada por región */
async function fetchSalasFromSheet() {
  const url = GAS_URL + (GAS_URL.includes("?") ? "&" : "?") + "sheet=Panel";
  const res = await fetch(url);
  const rows = await res.json();

  if (!Array.isArray(rows) || rows.length === 0) return [];

  // Detectar nombres de columnas (flexibles)
  const sample = rows[0];
  const allKeys = Object.keys(sample);
  console.log("[Zubale] Columnas del Sheet:", allKeys);
  console.log("[Zubale] Primer registro:", JSON.stringify(sample));

  const kEstado    = findKey(sample, "estado");
  const kCliente   = findKey(sample, "cliente");
  const kTienda    = findKey(sample, "sala", "tienda");
  const kRol       = findKey(sample, "servicio", "rol");
  const kLat       = findKey(sample, "lat");
  const kLng       = findKey(sample, "long", "lng");
  const kComuna    = findKey(sample, "comuna");
  const kRegion    = findKey(sample, "region", "región");
  const kDireccion = findKey(sample, "direcc", "address");
  const kTarifa    = findKey(sample, "tarifa", "drive");

  // Si no encontró la columna de tarifa, probar con la última columna
  const kTarifaFinal = kTarifa || allKeys[allKeys.length - 1];
  console.log("[Zubale] Columna tarifa detectada:", kTarifa, "→ usando:", kTarifaFinal);

  const salas = [];
  for (const r of rows) {
    const estado = String(r[kEstado] || "").trim().toUpperCase();
    if (estado === "OFF") continue;

    const name = String(r[kTienda] || "").trim();
    if (!name) continue;

    // GAS devuelve números nativos — no hay problema de coma/punto
    const lat = typeof r[kLat] === "number" ? r[kLat] : parseFloat(String(r[kLat]).replace(/,/g, ".")) || 0;
    const lng = typeof r[kLng] === "number" ? r[kLng] : parseFloat(String(r[kLng]).replace(/,/g, ".")) || 0;

    // Obtener tarifa — puede venir como string URL o como otro tipo
    const rawTarifa = r[kTarifaFinal];
    const tarifaStr = (rawTarifa && typeof rawTarifa === "object") ? (rawTarifa.url || rawTarifa.toString()) : String(rawTarifa || "");

    const previewUrl = driveToPreviewUrl(tarifaStr);
    salas.push({
      name,
      cliente: String(r[kCliente] || "").trim(),
      rol: String(r[kRol] || "Picker").trim(),
      lat,
      lng,
      comuna: String(r[kComuna] || "").trim(),
      region: String(r[kRegion] || "Sin región").trim(),
      direccion: String(r[kDireccion] || "").trim(),
      tarifaLink: previewUrl,
    });
    if (previewUrl) console.log("[Zubale] ✅ Tarifa:", name, "→", previewUrl);
  }

  // Agrupar por región
  const regionMap = {};
  salas.forEach(s => {
    if (!regionMap[s.region]) {
      const rc = getRegionCenter(s.region);
      regionMap[s.region] = { nombre: s.region, center: rc.center, zoom: rc.zoom, salas: [] };
    }
    regionMap[s.region].salas.push(s);
  });

  return Object.values(regionMap).sort((a, b) => b.salas.length - a.salas.length);
}

function GuiasModal({ rol, onClose }) {
  const slides = GUIAS[rol] || [];
  const [idx, setIdx] = useState(0);

  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const handleKey = (e) => {
      if (e.key === "Escape") onClose();
      if (e.key === "ArrowRight") setIdx(i => Math.min(slides.length - 1, i + 1));
      if (e.key === "ArrowLeft")  setIdx(i => Math.max(0, i - 1));
    };
    window.addEventListener("keydown", handleKey);
    return () => { window.removeEventListener("keydown", handleKey); document.body.style.overflow = prev; };
  }, [slides.length]);

  const total = slides.length;
  const slide = slides[idx];

  return (
    <div className="overlay guias-overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="guias-modal">
        <div className="guias-head">
          <div className="guias-head-text">
            <div className="guias-tag">📚 Guía oficial · {rol}</div>
            <div className="guias-title">Guía del Buen Zubalero</div>
            <div className="guias-sub">
              Todo lo que necesitas saber para ser un excelente {rol} con Zubale.
            </div>
          </div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>

        {total === 0 ? (
          <div className="guias-empty">
            <div className="guias-empty-icon">📖</div>
            <div className="guias-empty-title">Guía en preparación</div>
            <div className="guias-empty-text">
              Estamos preparando la guía oficial para {rol}. Muy pronto la tendrás disponible acá.
            </div>
          </div>
        ) : (
          <>
            <div className="guias-stage">
              <button
                className={"guias-nav prev " + (idx === 0 ? "disabled" : "")}
                onClick={() => setIdx(Math.max(0, idx - 1))}
                disabled={idx === 0}
                aria-label="Anterior"
              >
                ‹
              </button>
              <div className="guias-slide-wrap">
                <img
                  key={idx}
                  src={slide.img}
                  alt={slide.title}
                  className="guias-slide fade-in"
                />
              </div>
              <button
                className={"guias-nav next " + (idx === total - 1 ? "disabled" : "")}
                onClick={() => setIdx(Math.min(total - 1, idx + 1))}
                disabled={idx === total - 1}
                aria-label="Siguiente"
              >
                ›
              </button>
              {/* Mobile-only nav row (shown below slide via CSS) */}
              <div className="guias-mobile-nav">
                <button
                  className={"guias-nav " + (idx === 0 ? "disabled" : "")}
                  onClick={() => setIdx(Math.max(0, idx - 1))}
                  disabled={idx === 0}
                  aria-label="Anterior"
                >
                  ‹
                </button>
                <button
                  className={"guias-nav " + (idx === total - 1 ? "disabled" : "")}
                  onClick={() => setIdx(Math.min(total - 1, idx + 1))}
                  disabled={idx === total - 1}
                  aria-label="Siguiente"
                >
                  ›
                </button>
              </div>
            </div>
            <div className="guias-footer">
              <div className="guias-dots">
                {slides.map((_, i) => (
                  <button
                    key={i}
                    className={"guias-dot " + (i === idx ? "active" : "")}
                    onClick={() => setIdx(i)}
                    aria-label={`Ir al slide ${i + 1}`}
                  />
                ))}
              </div>
              <div className="guias-counter">
                {idx + 1} / {total}
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────
   HELPERS
   ───────────────────────────────────────────────── */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371; // km
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

/* ─────────────────────────────────────────────────
   FETCH: Videos desde hoja "URL" del Sheet
   ───────────────────────────────────────────────── */
function youtubeIdFromUrl(url) {
  if (!url) return null;
  const s = String(url).trim();
  let m = s.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = s.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = s.match(/\/embed\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  return null;
}

async function fetchVideosFromSheet() {
  try {
    const url = GAS_URL + (GAS_URL.includes("?") ? "&" : "?") + "sheet=URL";
    const res = await fetch(url);
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) return [];
    return rows.map(r => {
      const kTipo = findKey(r, "tipo", "titulo", "nombre");
      const kLink = findKey(r, "link", "url", "video");
      const titulo = kTipo ? String(r[kTipo] || "").trim() : "";
      const link   = kLink ? String(r[kLink] || "").trim() : "";
      return { titulo, link, ytId: youtubeIdFromUrl(link) };
    }).filter(v => v.titulo && v.link);
  } catch (err) {
    console.warn("[Zubale] Error cargando videos:", err);
    return [];
  }
}

/* ─────────────────────────────────────────────────
   MODAL: Búsqueda de salas por ciudad (con mapa real)
   ───────────────────────────────────────────────── */
function LocationsModal({ rol, onClose, onInscribirme }) {
  const [query, setQuery]       = useState("");
  const [regionIdx, setRegionIdx] = useState(0);
  const [retailFilter, setRetailFilter] = useState("Todos");
  const [openStore, setOpenStore] = useState(null);
  const [tarifaStore, setTarifaStore] = useState(null); // {name, imageUrl}
  const [selectedStoreIdx, setSelectedStoreIdx] = useState(null);
  const [storeOnMap, setStoreOnMap] = useState(null); // {store, regionName}
  const [locating, setLocating] = useState(false);
  const [mobileView, setMobileView] = useState("lista"); // "lista" | "mapa"

  /* ─── NUEVO: datos desde Google Sheets ─── */
  const [sheetRegiones, setSheetRegiones] = useState(null); // null = loading
  const [sheetError, setSheetError] = useState(null);

  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    let cancelled = false;
    fetchSalasFromSheet()
      .then(data => { if (!cancelled) setSheetRegiones(data); })
      .catch(err => { if (!cancelled) { console.error("Sheet fetch error:", err); setSheetError(err.message); setSheetRegiones([]); }});
    return () => { cancelled = true; document.body.style.overflow = prev; };
  }, []);

  /* Filtrar salas por rol seleccionado */
  const regionesPorRol = useMemo(() => {
    if (!sheetRegiones) return [];
    return sheetRegiones
      .map(r => ({
        ...r,
        salas: r.salas.filter(s => {
          // Si la sala tiene rol, filtrar. Si no tiene, mostrar en todos.
          if (!s.rol) return true;
          return s.rol.toLowerCase() === rol.toLowerCase();
        }),
      }))
      .filter(r => r.salas.length > 0);
  }, [sheetRegiones, rol]);

  const mapElRef    = useRef(null);
  const mapRef      = useRef(null);
  const tileLayerRef = useRef(null);
  const markersRef  = useRef([]);
  const popupRefs   = useRef({});
  const roRef       = useRef(null);

  useEffect(() => {
    const handleKey = (e) => { if (e.key === "Escape") !tarifaStore && onClose(); };
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, [tarifaStore]);

  /* filtrado por búsqueda + retail */
  const filteredRegions = useMemo(() => {
    const q = query.toLowerCase().trim();
    return regionesPorRol
      .map(r => ({
        ...r,
        salas: r.salas.filter(s => {
          const matchRetail = retailFilter === "Todos" || getRetail(s.name) === retailFilter;
          const matchQuery  = !q ||
            r.nombre.toLowerCase().includes(q) ||
            s.name.toLowerCase().includes(q) ||
            (s.direccion || "").toLowerCase().includes(q) ||
            (s.comuna || "").toLowerCase().includes(q);
          return matchRetail && matchQuery;
        }),
      }))
      .filter(r => r.salas.length > 0 || (!q && retailFilter === "Todos"));
  }, [query, retailFilter, regionesPorRol]);

  const activeRegion = filteredRegions[regionIdx] || filteredRegions[0];

  useEffect(() => { setRegionIdx(0); setOpenStore(null); setSelectedStoreIdx(null); }, [query, retailFilter]);

  /* ─── Inicializar el mapa Leaflet (solo si el contenedor está visible y datos cargados) ─── */
  useEffect(() => {
    if (!mapElRef.current || mapRef.current || !window.L || !sheetRegiones) return;
    // Esperar a que el contenedor sea visible (display:none → width=0)
    const rect = mapElRef.current.getBoundingClientRect();
    if (rect.width < 20 || rect.height < 20) return;
    const L = window.L;
    const initial = regionesPorRol[0] || { center: [-33.45, -70.67], zoom: 10 };
    const map = L.map(mapElRef.current, {
      center: initial.center,
      zoom: initial.zoom,
      zoomControl: true,
      scrollWheelZoom: true,
    });
    // CartoDB Voyager: basemap gratuito sin API key ni Referer, estilo Google Maps.
    // Nota: sin el sufijo @2x para máxima compatibilidad en mobile.
    const tileLayer = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png", {
      maxZoom: 19,
      subdomains: "abcd",
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank">CARTO</a>',
    });
    tileLayer.addTo(map);
    mapRef.current = map;
    tileLayerRef.current = tileLayer;

    /* Event delegation para botones dentro de popups de Leaflet.
       Más robusto que asignar .onclick en popupopen, porque no depende
       del timing de creación del DOM del popup. */
    const handlePopupBtnClick = (e) => {
      const tarifaBtn = e.target.closest(".popup-tarifa-btn");
      if (tarifaBtn) {
        e.stopPropagation();
        e.preventDefault();
        const sName = tarifaBtn.getAttribute("data-store");
        const sUrl  = tarifaBtn.getAttribute("data-url");
        if (sName && sUrl) {
          setTarifaStore({ name: sName, imageUrl: sUrl });
          if (mapRef.current) mapRef.current.closePopup();
        }
        return;
      }
    };
    mapElRef.current.addEventListener("click", handlePopupBtnClick);

    // ResizeObserver: cada vez que el contenedor cambia de tamaño (ej. cuando en mobile
    // se hace visible el tab "Mapa"), forzamos a Leaflet a recalcular y repintar tiles.
    if (typeof ResizeObserver !== "undefined") {
      const ro = new ResizeObserver(() => {
        if (mapRef.current) mapRef.current.invalidateSize({ animate: false });
      });
      ro.observe(mapElRef.current);
      roRef.current = ro;
    }

    // Invalidate varias veces al inicio para captar cualquier layout tardío del modal.
    [50, 150, 350, 700, 1200].forEach(delay => setTimeout(() => {
      if (mapRef.current) mapRef.current.invalidateSize({ animate: false });
    }, delay));

    return () => {
      if (roRef.current) { roRef.current.disconnect(); roRef.current = null; }
      if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
    };
  }, [sheetRegiones, mobileView]);

  // Invalidate map size when switching to mapa view on mobile
  useEffect(() => {
    if (mobileView === "mapa" && mapRef.current) {
      setTimeout(() => mapRef.current.invalidateSize(), 100);
    }
  }, [mobileView]);

  /* ─── Actualizar marcadores cuando cambia la ciudad ─── */
  useEffect(() => {
    const map = mapRef.current;
    if (!map || !activeRegion || !window.L) return;
    const L = window.L;

    // limpiar marcadores anteriores
    markersRef.current.forEach(m => map.removeLayer(m));
    markersRef.current = [];
    popupRefs.current = {};

    // mover la vista a la ciudad
    map.flyTo(activeRegion.center, activeRegion.zoom, { duration: 0.6 });

    // agregar nuevos marcadores
    activeRegion.salas.forEach((s, i) => {
      if (typeof s.lat !== "number" || typeof s.lng !== "number") return;
      const isActive = selectedStoreIdx === i;
      const icon = L.divIcon({
        className: "",
        iconSize: [38, 46],
        iconAnchor: [19, 42],
        popupAnchor: [0, -42],
        html: `<div class="zbl-marker-wrap ${isActive ? "active" : ""}">
                 <div class="zbl-marker"><span class="zbl-marker-inner">${ROLES[rol].emoji}</span></div>
               </div>`,
      });
      const marker = L.marker([s.lat, s.lng], { icon }).addTo(map);

      // popup HTML — data attrs para el handler
      const escapedName = s.name.replace(/"/g, "&quot;");
      const escapedUrl = (s.tarifaLink || "").replace(/"/g, "&quot;");
      const popupHtml = `
        <div class="popup-inner">
          <div class="popup-store-name">${s.name}</div>
          ${s.direccion ? `<div class="popup-store-addr">${s.direccion}</div>` : ""}
          ${s.tarifaLink ? `<button class="popup-tarifa-btn" data-store="${escapedName}" data-url="${escapedUrl}" type="button">💰 Ver Tarifas</button>` : ""}
          <a class="popup-inscribirme" href="${getFormUrl(s.name)}" target="_blank" rel="noopener noreferrer">✅ Inscribirme en esta sala</a>
        </div>
      `;
      marker.bindPopup(popupHtml, { closeButton: true, maxWidth: 260 });

      marker.on("click", () => {
        setSelectedStoreIdx(i);
        setOpenStore(i);
      });

      marker.on("popupopen", (e) => {
        const el = e.popup.getElement();
        if (!el) return;
        const btn = el.querySelector(".popup-inscribirme");
        if (btn) {
          btn.onclick = (ev) => {
            ev.stopPropagation();
            onInscribirme(s.name, activeRegion.nombre);
            map.closePopup();
          };
        }
        /* Nota: el click de .popup-tarifa-btn se maneja por event delegation
           en el contenedor del mapa (ver useEffect de inicialización). */
      });

      markersRef.current.push(marker);
      popupRefs.current[i] = marker;
    });

    // fit bounds si hay varias salas
    if (activeRegion.salas.length > 1) {
      const bounds = L.latLngBounds(activeRegion.salas.map(s => [s.lat, s.lng]));
      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
    }
  }, [regionIdx, query, retailFilter, activeRegion?.nombre]);

  /* ─── Cuando se selecciona una sala desde la lista, abrir popup en el mapa ─── */
  useEffect(() => {
    if (selectedStoreIdx == null) return;
    const marker = popupRefs.current[selectedStoreIdx];
    if (marker && mapRef.current) {
      mapRef.current.flyTo(marker.getLatLng(), Math.max(mapRef.current.getZoom(), 14), { duration: 0.5 });
      setTimeout(() => marker.openPopup(), 500);
    }
  }, [selectedStoreIdx]);

  /* ─── Geolocalización real ("Usar mi ubicación") ─── */
  const handleGeolocate = () => {
    if (!navigator.geolocation) {
      alert("Tu navegador no soporta geolocalización.");
      return;
    }
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setLocating(false);
        const { latitude, longitude } = pos.coords;
        const pool = (filteredRegions && filteredRegions.length > 0) ? filteredRegions : regionesPorRol;
        let best = { regionIdx: 0, storeIdx: 0, dist: Infinity, city: null, store: null };
        pool.forEach((city, ci) => {
          city.salas.forEach((sala, si) => {
            if (typeof sala.lat !== "number" || typeof sala.lng !== "number") return;
            const d = haversine(latitude, longitude, sala.lat, sala.lng);
            if (d < best.dist) {
              best = { regionIdx: ci, storeIdx: si, dist: d, city, store: sala };
            }
          });
        });
        if (best.store) {
          setRegionIdx(best.regionIdx);
          setOpenStore(best.storeIdx);
          setSelectedStoreIdx(best.storeIdx);
          // Abrir el mini-mapa del local más cercano
          setStoreOnMap({ store: best.store, cityName: best.city.nombre });
        } else {
          alert("No encontramos salas cerca de tu ubicación.");
        }
      },
      (err) => {
        setLocating(false);
        let msg = "No pudimos obtener tu ubicación.";
        if (err.code === 1) msg = "Necesitamos tu permiso de ubicación. Actívalo desde los ajustes del navegador.";
        if (err.code === 2) msg = "Ubicación no disponible en este momento. Intenta de nuevo.";
        if (err.code === 3) msg = "La solicitud tardó demasiado. Intenta de nuevo.";
        alert(msg);
      },
      { timeout: 12000, enableHighAccuracy: true, maximumAge: 60000 }
    );
  };

  const handleSelectStore = (idx) => {
    setOpenStore(openStore === idx ? null : idx);
    setSelectedStoreIdx(idx);
  };

  return (
    <>
      <div className="overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
        <div className="modal-locations">
          <div className="modal-head">
            <div>
              <h2>Descubre dónde puedes ser {rol}</h2>
              <p>Busca tu región o comuna, explora el mapa y elige la sala disponible más cercana a ti.</p>
            </div>
            <button className="modal-close" onClick={onClose}>×</button>
          </div>

          <div className="modal-search-row">
            <div className="search-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input
                placeholder="Busca por nombre de local o dirección"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
              />
            </div>
            <button className="btn-geo" onClick={handleGeolocate} disabled={locating}>
              {locating ? (
                <>
                  <span className="geo-spinner"></span>
                  Buscando...
                </>
              ) : (
                <>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.5 8 12 8 12s8-6.5 8-12a8 8 0 0 0-8-8z"/>
                  </svg>
                  Usar mi ubicación
                </>
              )}
            </button>
          </div>

          {/* MOBILE ONLY: horizontal city chips */}
          {/* Mobile: dropdown filters for Region + Retail */}
          <div className="mobile-filters-row">
            <div className="mobile-filter-group">
              <span className="mobile-filter-label">Región</span>
              <select
                className="mobile-filter-select"
                value={regionIdx}
                onChange={(e) => { setRegionIdx(Number(e.target.value)); setOpenStore(null); setSelectedStoreIdx(null); }}
              >
                {filteredRegions.map((r, i) => (
                  <option key={r.nombre} value={i}>
                    {r.nombre} ({r.salas.length})
                  </option>
                ))}
              </select>
            </div>
            <div className="mobile-filter-group">
              <span className="mobile-filter-label">Retail</span>
              <select
                className="mobile-filter-select"
                value={retailFilter}
                onChange={(e) => setRetailFilter(e.target.value)}
              >
                {RETAILS.map(r => (
                  <option key={r} value={r}>{r}</option>
                ))}
              </select>
            </div>
          </div>

          {/* LOADING STATE */}
          {sheetRegiones === null && (
            <div className="sheet-loading">
              <div className="geo-spinner" style={{width:"28px",height:"28px",borderWidth:"3px"}}></div>
              <span>Cargando salas disponibles...</span>
            </div>
          )}
          {sheetError && (
            <div className="sheet-error">
              <span>⚠️ No se pudieron cargar las salas. Verifica que el Sheet sea público.</span>
            </div>
          )}

function Timeline({ sheetVideos, onPlayVideo }) {
  const [activeIdx, setActiveIdx] = useState(null);
  const [viewImage, setViewImage] = useState(null); // {titulo, link}
  const [imgZoom, setImgZoom] = useState(1);
  const ref = useRef(null);

  useEffect(() => {
    const handleClickOutside = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setActiveIdx(null);
    };
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, []);

  // Lock body scroll when image modal is open + reset zoom
  useEffect(() => {
    if (viewImage) {
      setImgZoom(1);
      const prev = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      return () => { document.body.style.overflow = prev; };
    }
  }, [viewImage]);

  const active = activeIdx !== null ? TIMELINE_STEPS[activeIdx] : null;

  const handleVideo = (rowIdx) => {
    const vid = sheetVideos[rowIdx];
    if (!vid) return;
    if (window.location.protocol === "file:") {
      window.open(vid.link, "_blank");
    } else {
      onPlayVideo(vid);
    }
  };

  const handleImage = (rowIdx) => {
    const item = sheetVideos[rowIdx];
    if (!item) return;
    setViewImage(item);
  };

  return (
    <section className="timeline-card fade-in" ref={ref}>
      <div className="timeline-card-inner">
        <div className="timeline-title">Primeros Pasos para un Zubalero</div>
        <div className="timeline-track">
          {TIMELINE_STEPS.map((step, i) => (
            <div
              key={i}
              className={"tl-node" + (activeIdx === i ? " active" : "")}
              onClick={() => setActiveIdx(activeIdx === i ? null : i)}
            >
              <div className="tl-dot">{TL_ICONS[step.icon]}</div>
              <div className="tl-label">{step.label}</div>
            </div>
          ))}
          {/* Flecha final de la línea */}
          <div className="tl-arrow"></div>
        </div>

        {active && (
          <div className="tl-detail" key={activeIdx}>
            <div className="tl-detail-title">{active.title}</div>
            <div className="tl-detail-text">{active.text}</div>
            {active.appLinks && (
              <div className="app-btns">
                <a href="https://play.google.com/store/apps/details?id=mx.com.topup&pcampaignid=web_share" target="_blank" rel="noopener noreferrer">
                  <img src="https://mxb2c.zubale.com/wp-content/uploads/2023/10/google-play-esp-1.png" alt="Google Play" />
                </a>
                <a href="https://apps.apple.com/cl/app/zubale/id1403846238" target="_blank" rel="noopener noreferrer">
                  <img src="https://mxb2c.zubale.com/wp-content/uploads/2023/10/app-store-esp-1.png" alt="App Store" />
                </a>
              </div>
            )}
            <div className="tl-detail-actions">
              {active.imageRow != null && sheetVideos[active.imageRow] && (
                <button className="tl-action-btn" onClick={() => handleImage(active.imageRow)}>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  Ver Imagen
                </button>
              )}
              {active.videoRow != null && sheetVideos[active.videoRow] && (
                <button className="tl-action-btn tl-action-video" onClick={() => handleVideo(active.videoRow)}>
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                  Ver Video
                </button>
              )}
            </div>
          </div>
        )}
      </div>

      {viewImage && ReactDOM.createPortal(
        <div className="overlay tarifa-overlay" style={{ display: "block", overflowY: "auto", padding: "30px 20px" }} onClick={(e) => e.target === e.currentTarget && setViewImage(null)}>
          <div className="tarifa-modal-img" style={{ margin: "0 auto" }}>
            <div className="tarifa-modal-head">
              <div className="tarifa-modal-title">{viewImage.titulo}</div>
              <button className="tarifa-close-btn" onClick={() => setViewImage(null)} aria-label="Cerrar">×</button>
            </div>
            <div className="tarifa-img-wrap" style={{ cursor: imgZoom > 1 ? "zoom-out" : "zoom-in" }}>
              <img
                src={driveToDirectImageUrl(viewImage.link) || viewImage.link}
                alt={viewImage.titulo}
                style={{ width: imgZoom > 1 ? "200%" : "100%", display: "block", background: "#fff", transition: "width 0.2s ease" }}
                onClick={() => setImgZoom(z => z > 1 ? 1 : 2)}
              />
            </div>
          </div>
        </div>,
        document.body
      )}
    </section>
  );
}
