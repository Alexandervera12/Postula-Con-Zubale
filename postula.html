function LocationsModal({ rol, onClose, onInscribirme }) {
  const [query, setQuery]       = useState("");
  const [regionIdx, setRegionIdx] = useState(0);
  const [retailFilter, setRetailFilter] = useState("Todos");
  const [openStore, setOpenStore] = useState(null);
  const [tarifaStore, setTarifaStore] = useState(null); // {name, imageUrl}
  const [selectedStoreIdx, setSelectedStoreIdx] = useState(null);
  const [storeOnMap, setStoreOnMap] = useState(null); // {store, regionName}
  const [locating, setLocating] = useState(false);
  const [mobileView, setMobileView] = useState("lista"); // "lista" | "mapa"
  const [mapReady, setMapReady] = useState(false);

  /* ─── NUEVO: datos desde Google Sheets ─── */
  const [sheetRegiones, setSheetRegiones] = useState(null); // null = loading
  const [sheetError, setSheetError] = useState(null);

  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    let cancelled = false;
    fetchSalasFromSheet()
      .then(data => { if (!cancelled) setSheetRegiones(data); })
      .catch(err => { if (!cancelled) { console.error("Sheet fetch error:", err); setSheetError(err.message); setSheetRegiones([]); }});
    return () => { cancelled = true; document.body.style.overflow = prev; };
  }, []);

  const regionesPorRol = useMemo(() => {
    if (!sheetRegiones) return [];
    return sheetRegiones
      .map(r => ({
        ...r,
        salas: r.salas.filter(s => {
          if (!s.rol) return true;
          return s.rol.toLowerCase() === rol.toLowerCase();
        }),
      }))
      .filter(r => r.salas.length > 0);
  }, [sheetRegiones, rol]);

  const mapElRef    = useRef(null);
  const mapRef      = useRef(null);
  const tileLayerRef = useRef(null);
  const markersRef  = useRef([]);
  const popupRefs   = useRef({});
  const roRef       = useRef(null);

  useEffect(() => {
    const handleKey = (e) => { if (e.key === "Escape") !tarifaStore && onClose(); };
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, [tarifaStore]);

  const filteredRegions = useMemo(() => {
    const q = query.toLowerCase().trim();
    return regionesPorRol
      .map(r => ({
        ...r,
        salas: r.salas.filter(s => {
          const matchRetail = retailFilter === "Todos" || getRetail(s.name) === retailFilter;
          const matchQuery  = !q ||
            r.nombre.toLowerCase().includes(q) ||
            s.name.toLowerCase().includes(q) ||
            (s.direccion || "").toLowerCase().includes(q) ||
            (s.comuna || "").toLowerCase().includes(q);
          return matchRetail && matchQuery;
        }),
      }))
      .filter(r => r.salas.length > 0 || (!q && retailFilter === "Todos"));
  }, [query, retailFilter, regionesPorRol]);

  const activeRegion = filteredRegions[regionIdx] || filteredRegions[0];

  useEffect(() => { setRegionIdx(0); setOpenStore(null); setSelectedStoreIdx(null); }, [query, retailFilter]);

  /* ─── Inicializar el mapa Leaflet (solo si el contenedor está visible y datos cargados) ─── */
  useEffect(() => {
    if (!mapElRef.current || mapRef.current || !window.L || !sheetRegiones) return;
    const rect = mapElRef.current.getBoundingClientRect();
    if (rect.width < 20 || rect.height < 20) return;
    const L = window.L;
    const initial = regionesPorRol[0] || { center: [-33.45, -70.67], zoom: 10 };
    const map = L.map(mapElRef.current, {
      center: initial.center,
      zoom: initial.zoom,
      zoomControl: true,
      scrollWheelZoom: true,
    });
    const tileLayer = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png", {
      maxZoom: 19,
      subdomains: "abcd",
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank">CARTO</a>',
    });
    tileLayer.addTo(map);
    mapRef.current = map;
    tileLayerRef.current = tileLayer;
    setMapReady(true);

    /* Event delegation para botones dentro de popups de Leaflet.
       Más robusto que asignar .onclick en popupopen, porque no depende
       del timing de creación del DOM del popup. */
    const handlePopupBtnClick = (e) => {
      const tarifaBtn = e.target.closest(".popup-tarifa-btn");
      if (tarifaBtn) {
        e.stopPropagation();
        e.preventDefault();
        const sName = tarifaBtn.getAttribute("data-store");
        const sUrl  = tarifaBtn.getAttribute("data-url");
        if (sName && sUrl) {
          setTarifaStore({ name: sName, imageUrl: sUrl });
          if (mapRef.current) mapRef.current.closePopup();
        }
        return;
      }
    };
    mapElRef.current.addEventListener("click", handlePopupBtnClick);

    if (typeof ResizeObserver !== "undefined") {
      const ro = new ResizeObserver(() => {
        if (mapRef.current) mapRef.current.invalidateSize({ animate: false });
      });
      ro.observe(mapElRef.current);
      roRef.current = ro;
    }

    [50, 150, 350, 700, 1200].forEach(delay => setTimeout(() => {
      if (mapRef.current) mapRef.current.invalidateSize({ animate: false });
    }, delay));

    return () => {
      if (roRef.current) { roRef.current.disconnect(); roRef.current = null; }
      if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
    };
  }, [sheetRegiones]);

  useEffect(() => {
    if (mobileView !== "mapa" || !mapElRef.current || !window.L || !sheetRegiones) return;
    if (mapRef.current) {
      setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, 150);
      return;
    }
    const timer = setTimeout(() => {
      if (mapRef.current || !mapElRef.current) return;
      const rect = mapElRef.current.getBoundingClientRect();
      if (rect.width < 20 || rect.height < 20) return;
      const L = window.L;
      const initial = regionesPorRol[0] || { center: [-33.45, -70.67], zoom: 10 };
      const map = L.map(mapElRef.current, { center: initial.center, zoom: initial.zoom, zoomControl: true, scrollWheelZoom: true });
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png", { maxZoom: 19, subdomains: "abcd" }).addTo(map);
      mapRef.current = map;
      setMapReady(true);

      mapElRef.current.addEventListener("click", (e) => {
        const tarifaBtn = e.target.closest(".popup-tarifa-btn");
        if (tarifaBtn) {
          e.stopPropagation(); e.preventDefault();
          const sName = tarifaBtn.getAttribute("data-store");
          const sUrl = tarifaBtn.getAttribute("data-url");
          if (sName && sUrl) { setTarifaStore({ name: sName, imageUrl: sUrl }); map.closePopup(); }
        }
      });

      [100, 300, 600].forEach(d => setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, d));
    }, 250);
    return () => clearTimeout(timer);
  }, [mobileView, sheetRegiones]);

  /* ─── Actualizar marcadores cuando cambia la ciudad ─── */
  useEffect(() => {
    const map = mapRef.current;
    if (!map || !activeRegion || !window.L) return;
    const L = window.L;

    markersRef.current.forEach(m => map.removeLayer(m));
    markersRef.current = [];
    popupRefs.current = {};

    map.flyTo(activeRegion.center, activeRegion.zoom, { duration: 0.6 });

    activeRegion.salas.forEach((s, i) => {
      if (typeof s.lat !== "number" || typeof s.lng !== "number") return;
      const isActive = selectedStoreIdx === i;
      const icon = L.divIcon({
        className: "",
        iconSize: [38, 46],
        iconAnchor: [19, 42],
        popupAnchor: [0, -42],
        html: `<div class="zbl-marker-wrap ${isActive ? "active" : ""}">
                 <div class="zbl-marker"><span class="zbl-marker-inner">${ROLES[rol].emoji}</span></div>
               </div>`,
      });
      const marker = L.marker([s.lat, s.lng], { icon }).addTo(map);

      const escapedName = s.name.replace(/"/g, "&quot;");
      const escapedUrl = (s.tarifaLink || "").replace(/"/g, "&quot;");
      const popupHtml = `
        <div class="popup-inner">
          <div class="popup-store-name">${s.name}</div>
          ${s.direccion ? `<div class="popup-store-addr">${s.direccion}</div>` : ""}
          ${s.tarifaLink ? `<button class="popup-tarifa-btn" data-store="${escapedName}" data-url="${escapedUrl}" type="button">💰 Ver Tarifas</button>` : ""}
          <a class="popup-inscribirme" href="${getFormUrl(s.name)}" target="_blank" rel="noopener noreferrer">✅ Inscribirme en esta sala</a>
        </div>
      `;
      marker.bindPopup(popupHtml, { closeButton: true, maxWidth: 260 });

      marker.on("click", () => {
        setSelectedStoreIdx(i);
        setOpenStore(i);
      });

      marker.on("popupopen", (e) => {
        const el = e.popup.getElement();
        if (!el) return;
        const btn = el.querySelector(".popup-inscribirme");
        if (btn) {
          btn.onclick = (ev) => {
            ev.stopPropagation();
            onInscribirme(s.name, activeRegion.nombre);
            map.closePopup();
          };
        }
        /* Nota: el click de .popup-tarifa-btn se maneja por event delegation
           en el contenedor del mapa (ver useEffect de inicialización). */
      });

      markersRef.current.push(marker);
      popupRefs.current[i] = marker;
    });

    if (activeRegion.salas.length > 1) {
      const bounds = L.latLngBounds(activeRegion.salas.map(s => [s.lat, s.lng]));
      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
    }
  }, [regionIdx, query, retailFilter, activeRegion?.nombre, mapReady]);

  /* ─── Cuando se selecciona una sala desde la lista, abrir popup en el mapa ─── */
  useEffect(() => {
    if (selectedStoreIdx == null) return;
    const marker = popupRefs.current[selectedStoreIdx];
    if (marker && mapRef.current) {
      mapRef.current.flyTo(marker.getLatLng(), Math.max(mapRef.current.getZoom(), 14), { duration: 0.5 });
      setTimeout(() => marker.openPopup(), 500);
    }
  }, [selectedStoreIdx]);

  /* ─── Geolocalización real ("Usar mi ubicación") ─── */
  const handleGeolocate = () => {
    if (!navigator.geolocation) {
      alert("Tu navegador no soporta geolocalización.");
      return;
    }
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setLocating(false);
        const { latitude, longitude } = pos.coords;
        const pool = (filteredRegions && filteredRegions.length > 0) ? filteredRegions : regionesPorRol;
        let best = { regionIdx: 0, storeIdx: 0, dist: Infinity, city: null, store: null };
        pool.forEach((city, ci) => {
          city.salas.forEach((sala, si) => {
            if (typeof sala.lat !== "number" || typeof sala.lng !== "number") return;
            const d = haversine(latitude, longitude, sala.lat, sala.lng);
            if (d < best.dist) {
              best = { regionIdx: ci, storeIdx: si, dist: d, city, store: sala };
            }
          });
        });
        if (best.store) {
          setRegionIdx(best.regionIdx);
          setOpenStore(best.storeIdx);
          setSelectedStoreIdx(best.storeIdx);
          setStoreOnMap({ store: best.store, cityName: best.city.nombre });
        } else {
          alert("No encontramos salas cerca de tu ubicación.");
        }
      },
      (err) => {
        setLocating(false);
        let msg = "No pudimos obtener tu ubicación.";
        if (err.code === 1) msg = "Necesitamos tu permiso de ubicación. Actívalo desde los ajustes del navegador.";
        if (err.code === 2) msg = "Ubicación no disponible en este momento. Intenta de nuevo.";
        if (err.code === 3) msg = "La solicitud tardó demasiado. Intenta de nuevo.";
        alert(msg);
      },
      { timeout: 12000, enableHighAccuracy: true, maximumAge: 60000 }
    );
  };

  const handleSelectStore = (idx) => {
    setOpenStore(openStore === idx ? null : idx);
    setSelectedStoreIdx(idx);
  };

  return (
    <>
      <div className="overlay" onClick={(e) => e.target === e.currentTarget && onClose()}>
        <div className="modal-locations">
          <div className="modal-head">
            <div>
              <h2>Descubre dónde puedes ser {rol}</h2>
              <p>Busca tu región o comuna, explora el mapa y elige la sala disponible más cercana a ti.</p>
            </div>
            <button className="modal-close" onClick={onClose}>×</button>
          </div>

          <div className="modal-search-row">
            <div className="search-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input
                placeholder="Busca por nombre de local o dirección"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
              />
            </div>
            <button className="btn-geo" onClick={handleGeolocate} disabled={locating}>
              {locating ? (
                <>
                  <span className="geo-spinner"></span>
                  Buscando...
                </>
              ) : (
                <>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.5 8 12 8 12s8-6.5 8-12a8 8 0 0 0-8-8z"/>
                  </svg>
                  Usar mi ubicación
                </>
              )}
            </button>
          </div>

          {/* MOBILE ONLY: horizontal city chips */}
          {/* Mobile: dropdown filters for Region + Retail */}
          <div className="mobile-filters-row">
            <div className="mobile-filter-group">
              <span className="mobile-filter-label">Región</span>
              <select
                className="mobile-filter-select"
                value={regionIdx}
                onChange={(e) => { setRegionIdx(Number(e.target.value)); setOpenStore(null); setSelectedStoreIdx(null); }}
              >
                {filteredRegions.map((r, i) => (
                  <option key={r.nombre} value={i}>
                    {r.nombre} ({r.salas.length})
                  </option>
                ))}
              </select>
            </div>
            <div className="mobile-filter-group">
              <span className="mobile-filter-label">Retail</span>
              <select
                className="mobile-filter-select"
                value={retailFilter}
                onChange={(e) => setRetailFilter(e.target.value)}
              >
                {RETAILS.map(r => (
                  <option key={r} value={r}>{r}</option>
                ))}
              </select>
            </div>
          </div>

          {/* LOADING STATE */}
          {sheetRegiones === null && (
            <div className="sheet-loading">
              <div className="geo-spinner" style={{width:"28px",height:"28px",borderWidth:"3px"}}></div>
              <span>Cargando salas disponibles...</span>
            </div>
          )}
          {sheetError && (
            <div className="sheet-error">
              <span>⚠️ No se pudieron cargar las salas. Verifica que el Sheet sea público.</span>
            </div>
          )}

          <div className="mobile-tabs">
            <button className={"mobile-tab" + (mobileView === "lista" ? " active" : "")} onClick={() => setMobileView("lista")}>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              Lista
            </button>
            <button className={"mobile-tab" + (mobileView === "mapa" ? " active" : "")} onClick={() => setMobileView("mapa")}>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
              Mapa
            </button>
          </div>
          <div className={"modal-body" + (mobileView === "mapa" ? " mobile-show-mapa" : "")} style={{ display: sheetRegiones === null ? "none" : undefined }}>
            <div className="cities-col">
              <div className="cities-title">Regiones</div>
              {filteredRegions.length === 0 ? (
                <div className="empty" style={{ padding: "24px 10px" }}>
                  <div className="empty-icon">🔍</div>
                  <div className="empty-title">Sin resultados</div>

                </div>
              ) : (
                filteredRegions.map((c, i) => (
                  <div
                    key={c.nombre}
                    className={"city-item " + (i === regionIdx ? "active" : "")}
                    onClick={() => { setRegionIdx(i); setOpenStore(null); setSelectedStoreIdx(null); }}
                  >
                    <span>📍 {c.nombre}</span>
                    <span className="city-count">{c.salas.length}</span>
                  </div>
                ))
              )}
            </div>

            <div className="stores-col">
              {activeRegion ? (
                <>
                  <div className="stores-head">
                    <h3>Salas en {activeRegion.nombre}</h3>
                  </div>
                  <div className="retail-filter-row">
                    <label className="retail-filter-label">Retail:</label>
                    <select
                      className="retail-filter-select"
                      value={retailFilter}
                      onChange={(e) => setRetailFilter(e.target.value)}
                    >
                      {RETAILS.map(r => (
                        <option key={r} value={r}>{r}</option>
                      ))}
                    </select>
                  </div>
                  {activeRegion.salas.length === 0 ? (
                    <div className="empty">
                      <div className="empty-icon">😕</div>
                      <div className="empty-title">No encontramos salas</div>
                      <div className="empty-text">Intenta con otra ciudad o comuna.</div>
                    </div>
                  ) : (
                    activeRegion.salas.map((s, i) => {
                      const isOpen = openStore === i;
                      const isSelected = selectedStoreIdx === i;
                      return (
                        <div
                          className={"store-row fade-in " + (isSelected ? "selected" : "")}
                          key={s.name}
                          style={{ animationDelay: (i * 0.04) + "s", cursor: "pointer" }}
                          onClick={() => handleSelectStore(i)}
                        >
                          <div className="store-row-top">
                            <div className="store-row-icon">{ROLES[rol].emoji}</div>
                            <div className="store-row-main">
                              <div className="store-row-name">

                              </div>
                              {s.direccion && <div className="store-row-addr">{s.direccion}</div>}
                              <button
                                className="store-row-maplink"
                                onClick={(e) => { e.stopPropagation(); setStoreOnMap({ store: s, cityName: activeRegion.nombre }); }}
                              >
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                                </svg>
                                Ver en mapa
                              </button>
                            </div>
                            <button
                              className={"store-row-toggle " + (isOpen ? "open" : "")}
                              onClick={(e) => { e.stopPropagation(); handleSelectStore(i); }}
                            >
                              Más info
                              <span className="chev">▾</span>
                            </button>
                          </div>
                          <div className={"store-row-expand " + (isOpen ? "open" : "")}>
                            <div className="store-row-actions">
                              {s.tarifaLink && (
                                <button
                                  className="ver-tarifas-btn"
                                  onClick={(e) => { e.stopPropagation(); setTarifaStore({ name: s.name, imageUrl: s.tarifaLink }); }}
                                >
                                  💰 Ver Tarifas
                                </button>
                              )}
                              <a
                                href={getFormUrl(s.name)}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="inscribirme-btn"
                                onClick={() => onInscribirme(s.name, activeRegion.nombre)}
                              >
                                ✅ Inscribirme en {s.name}
                              </a>
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </>
              ) : (
                <div className="empty">
                  <div className="empty-icon">🏪</div>
                  <div className="empty-title">Selecciona una ciudad</div>
                  <div className="empty-text">Escoge una ciudad del listado de la izquierda.</div>
                </div>
              )}
            </div>

            <div className="map-col">
              <div ref={mapElRef} style={{ width: "100%", height: "100%" }}></div>
            </div>
          </div>
        </div>
      </div>

      {tarifaStore && (
        <TarifaModal
          storeName={tarifaStore.name}
          imageUrl={tarifaStore.imageUrl}
          onClose={() => setTarifaStore(null)}
        />
      )}

      {storeOnMap && (
        <StoreMapModal
          rol={rol}
          store={storeOnMap.store}
          cityName={storeOnMap.cityName}
          onClose={() => setStoreOnMap(null)}
          onInscribirme={(name, city) => {
            setStoreOnMap(null);
            onInscribirme(name, city);
          }}
          onShowTarifa={(name, imageUrl) => setTarifaStore({ name, imageUrl })}
        />
      )}
    </>
  );
}

function Timeline({ sheetVideos, onPlayVideo }) {
  const [activeIdx, setActiveIdx] = useState(null);
  const [viewImage, setViewImage] = useState(null); // {titulo, link}
  const [imgZoom, setImgZoom] = useState(1);
  const ref = useRef(null);

  useEffect(() => {
    const handleClickOutside = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setActiveIdx(null);
    };
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, []);

  useEffect(() => {
    if (viewImage) {
      setImgZoom(1);
      const prev = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      return () => { document.body.style.overflow = prev; };
    }
  }, [viewImage]);

  const active = activeIdx !== null ? TIMELINE_STEPS[activeIdx] : null;

  const handleVideo = (rowIdx) => {
    const vid = sheetVideos[rowIdx];
    if (!vid) return;
    if (window.location.protocol === "file:") {
      window.open(vid.link, "_blank");
    } else {
      onPlayVideo(vid);
    }
  };

  const handleImage = (rowIdx) => {
    const item = sheetVideos[rowIdx];
    if (!item) return;
    setViewImage(item);
  };

  return (
    <section className="timeline-card fade-in" ref={ref}>
      <div className="timeline-card-inner">
        <div className="timeline-title">Primeros Pasos para un Zubalero</div>
        <div style={{textAlign:"center",fontSize:"13px",color:"#6b7280",marginTop:"-2px",marginBottom:"6px",fontStyle:"italic"}}>Puedes hacer click en los iconos para más información</div>
        <div className="timeline-track">
          {TIMELINE_STEPS.map((step, i) => (
            <div
              key={i}
              className={"tl-node" + (activeIdx === i ? " active" : "")}
              onClick={() => setActiveIdx(activeIdx === i ? null : i)}
            >
              <div className="tl-dot">{TL_ICONS[step.icon]}</div>
              <div className="tl-label">{step.label}</div>
            </div>
          ))}
          <div className="tl-arrow"></div>
        </div>

        {active && (
          <div className="tl-detail" key={activeIdx}>
            <div className="tl-detail-title">{active.title}</div>
            <div className="tl-detail-text">{active.text}</div>
            {active.appLinks && (
              <div className="app-btns">
                <a href="https://play.google.com/store/apps/details?id=mx.com.topup&pcampaignid=web_share" target="_blank" rel="noopener noreferrer">
                  <img src="https://mxb2c.zubale.com/wp-content/uploads/2023/10/google-play-esp-1.png" alt="Google Play" />
                </a>
                <a href="https://apps.apple.com/cl/app/zubale/id1403846238" target="_blank" rel="noopener noreferrer">
                  <img src="https://mxb2c.zubale.com/wp-content/uploads/2023/10/app-store-esp-1.png" alt="App Store" />
                </a>
              </div>
            )}
            <div className="tl-detail-actions">
              {active.imageRow != null && sheetVideos[active.imageRow] && (
                <button className="tl-action-btn" onClick={() => handleImage(active.imageRow)}>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  Ver Imagen
                </button>
              )}
              {active.videoRow != null && sheetVideos[active.videoRow] && (
                <button className="tl-action-btn tl-action-video" onClick={() => handleVideo(active.videoRow)}>
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                  Ver Video
                </button>
              )}
            </div>
          </div>
        )}
      </div>

      {viewImage && ReactDOM.createPortal(
        <div className="overlay tarifa-overlay" style={{ display: "block", overflowY: "auto", padding: "30px 20px" }} onClick={(e) => e.target === e.currentTarget && setViewImage(null)}>
          <div className="tarifa-modal-img" style={{ margin: "0 auto" }}>
            <div className="tarifa-modal-head">
              <div className="tarifa-modal-title">{viewImage.titulo}</div>
              <button className="tarifa-close-btn" onClick={() => setViewImage(null)} aria-label="Cerrar">×</button>
            </div>
            <div className="tarifa-img-wrap" style={{ cursor: imgZoom > 1 ? "zoom-out" : "zoom-in" }}>
              <img
                src={driveToDirectImageUrl(viewImage.link) || viewImage.link}
                alt={viewImage.titulo}
                style={{ width: imgZoom > 1 ? "200%" : "100%", display: "block", background: "#fff", transition: "width 0.2s ease" }}
                onClick={() => setImgZoom(z => z > 1 ? 1 : 2)}
              />
            </div>
          </div>
        </div>,
        document.body
      )}
    </section>
  );
}

  const [showGuias, setShowGuias] = useState(false);

            <span className="hero-badge b1"><span className="bi">💸</span> Pagos semanales</span>
            <span className="hero-badge b2"><span className="bi">🕐</span> Tú eliges tu horario</span>
            <span className="hero-badge b3"><span className="bi">✅</span> Sin experiencia</span>
            <span className="hero-badge b4"><span className="bi">🚀</span> Empieza HOY</span>
          </div>
        </div>
      </section>

      {/* TIMELINE: Primeros Pasos */}
      <Timeline sheetVideos={sheetVideos} onPlayVideo={setPlayingVideo} />

      {/* CONTENT SPLIT */}
      <main className="main">
        <div className="split-wrap" key={rol /* force re-mount for animation */}>

          {/* LEFT: 3 info cards */}
          <div className="info-grid">

            <div className="info-card fade-in stagger-1">
              <div className="info-card-head">
                <div className="info-card-icon">💡</div>
                <div className="info-card-title">¿Qué es un {rol}?</div>
              </div>
              <p>{data.descripcion}</p>
            </div>

            <div className="info-card fade-in stagger-2">
              <div className="info-card-head">
                <div className="info-card-icon">📋</div>
                <div className="info-card-title">¿Qué necesitas para ser {rol}?</div>
              </div>
              <ul>
                {data.requisitos.map((req, i) => (
                  <li key={i}>{req}</li>
                ))}
              </ul>
            </div>

            {data.vehiculos ? (
              data.vehiculos.map((veh, vi) => (
                <div className={`info-card fade-in stagger-${3 + vi}`} key={veh.nombre}>
                  <div className="info-card-head">
                    <div className="info-card-icon">{veh.emoji}</div>
                    <div className="info-card-title">¿Cuánto gana un {rol} {veh.nombre}?</div>
                  </div>
                  {veh.ganancias.map((g, i) => (
                    <div className="earn-row" key={i}>
                      <span className="earn-label">{g.label}</span>
                      <span className="earn-value">{g.value}</span>
                    </div>
                  ))}
                  <div className="earn-note">*Valores referenciales, calculados en base al promedio de ganancias.</div>
                  <div className="earn-note">*Montos brutos.</div>
                </div>
              ))
            ) : (
              <div className="info-card fade-in stagger-3">
                <div className="info-card-head">
                  <div className="info-card-icon">💰</div>
                  <div className="info-card-title">¿Cuánto gana un {rol}?</div>
                </div>
                {data.ganancias.map((g, i) => (
                  <div className="earn-row" key={i}>
                    <span className="earn-label">{g.label}</span>
                    <span className="earn-value">{g.value}</span>
                  </div>
                ))}
                <div className="earn-note">*Valores referenciales, calculados en base al promedio de ganancias.</div>
                <div className="earn-note">*Montos brutos.</div>
              </div>
            )}

            {/* Card Guías → abre la guía oficial en un modal */}
            <div
              className="guias-card fade-in stagger-4"
              onClick={() => setShowGuias(true)}
            >
              <div className="guias-card-bg"></div>
              <div className="guias-card-content">
                <div className="guias-card-head">
                  <div className="guias-card-icon">📚</div>
                  <div>
                    <div className="guias-card-tag">Guía oficial</div>
                    <div className="guias-card-title">Guía del Buen {rol === "Picker" ? "Zubalero" : rol}</div>
                  </div>
                </div>
                <div className="guias-card-sub">
                  Aprende los tips, protocolos y mejores prácticas para destacar como {rol} desde el día uno.
                </div>
                <button className="guias-card-btn" onClick={(e) => { e.stopPropagation(); setShowGuias(true); }}>
                  <span>🚀 Ver la guía</span>
                  <span>→</span>
                </button>
              </div>
            </div>

          </div>

          {/* RIGHT: Locations card + FAQs */}
          <div className="right-col">
            <div className="locations-card fade-in stagger-1" onClick={() => setShowLocations(true)}>
              <div>
                <div className="loc-tag">📍 Ubicaciones</div>
                <div className="loc-title">Dónde puedes ser {rol}</div>
                <div className="loc-sub">
                  Explora las ciudades y salas en las que Zubale tiene cupos abiertos para {rol}s ahora mismo.
                </div>
                <div className="loc-mini-list">
                  <div className="loc-mini"><span className="loc-mini-dot"></span> Disponibilidad en diferentes partes del país</div>
                  <div className="loc-mini"><span className="loc-mini-dot"></span> Tarifas específicas por sala</div>
                </div>
              </div>
              <button className="loc-cta" onClick={(e) => { e.stopPropagation(); setShowLocations(true); }}>
                <span className="loc-cta-icon">🔍</span>
                Ver salas disponibles
                <span style={{ marginLeft: "auto" }}>→</span>
              </button>
            </div>

            {data.faqs && (
              <div className="faqs-card fade-in stagger-2">
                <div className="faqs-head">
                  <div className="faqs-icon">?</div>
                  <div>
                    <div className="faqs-title">Preguntas frecuentes</div>
                    <div className="faqs-sub">Todo lo que necesitas saber sobre ser {rol}</div>
                  </div>
                </div>
                {data.faqs.map((f, i) => (
                  <FaqItem key={rol + "-" + i} q={f.q} a={f.a} />
                ))}
              </div>
              
            )}


            {data.faqs && (
              <div className="faqs-card fade-in stagger-2">
                <div className="faqs-head">
                  <div className="faqs-icon">?</div>
                  <div>
                    <div className="faqs-title">Problemas frecuentes al momento de registrarte</div>
              
                  </div>
                </div>
                {data.pfrec.map((f, i) => (
                  <FaqItem key={rol + "-" + i} q={f.q} a={f.a} />
                ))}
              </div>
              
            )}
            {/* Video de capacitación — primer video de hoja "URL" del Sheet */}
            {sheetVideos.find(v => v.ytId) ? (() => {
              const vid = sheetVideos.find(v => v.ytId);
              return (
                <div className="video-card fade-in stagger-3">
                  <div className="video-card-head">
                    <div className="video-card-icon">▶</div>
                    <div>
                      <div className="video-card-title">{vid.titulo}</div>
                      <div className="video-card-sub">Mira el video y prepárate para empezar</div>
                    </div>
                  </div>
                  <div className="video-thumb-link" onClick={() => {
                    if (window.location.protocol === "file:") {
                      window.open(vid.link, "_blank");
                    } else {
                      setPlayingVideo(vid);
                    }
                  }}>
                    <img
                      src={`https://img.youtube.com/vi/${vid.ytId}/hqdefault.jpg`}
                      alt={vid.titulo}
                      className="video-thumb-img"
                    />
                    <div className="video-thumb-play">▶</div>
                  </div>
                </div>
              );
            })() : (
              <div className="video-card fade-in stagger-3">
                <div className="video-card-head">
                  <div className="video-card-icon">▶</div>
                  <div>
                    <div className="video-card-title">Video: ¿Cómo ser un buen {rol}?</div>
                    <div className="video-card-sub">Mira el video y prepárate para empezar</div>
                  </div>
                </div>
                <div className="video-embed">
                  <div className="video-placeholder">
                    <div className="video-placeholder-icon">▶</div>
                    <div className="video-placeholder-text">Cargando...</div>
                  </div>
                </div>
              </div>
            )}
          </div>

        </div>

        {/* FINAL CTA */}
        <div className="final-cta-wrap">
          <h3>¿Listo para empezar como {rol}?</h3>
          <p>Postula en segundos y recibe los próximos pasos por WhatsApp para comenzar a generar ganancias esta misma semana.</p>
          <div className="final-cta-buttons">
            <a className="btn-primary" href="https://www.zubalero.com/cl/" target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none", textAlign: "center" }}>
              Postula Con Zubale
            </a>
          </div>
        </div>

        {/* APP DOWNLOAD BANNER — compacto, al final */}
        <section className="app-banner fade-in" aria-label="Descarga la app de Zubale">
          <div className="app-banner-img-link">
            <img
              src="https://www.zubalero.com/cl/wp-content/uploads/2023/11/banner_website_baixeoapp-spanish.png"
              alt="Descarga la app Zubale y empieza hoy mismo"
              className="app-banner-img"
              loading="lazy"
            />
          </div>
          <div className="app-banner-stores">
            <a
              href="https://play.google.com/store/apps/details?id=mx.com.topup&pcampaignid=web_share"
              target="_blank"
              rel="noopener noreferrer"
              className="app-banner-store-link"
              aria-label="Descargar en Google Play"
            >
              <img
                src="https://mxb2c.zubale.com/wp-content/uploads/2023/10/google-play-esp-1.png"
                alt="Disponible en Google Play"
                className="app-banner-store-img"
                loading="lazy"
              />
            </a>
            <a
              href="https://apps.apple.com/cl/app/zubale/id1403846238"
              target="_blank"
              rel="noopener noreferrer"
              className="app-banner-store-link"
              aria-label="Descargar en App Store"
            >
              <img
                src="https://mxb2c.zubale.com/wp-content/uploads/2023/10/app-store-esp-1.png"
                alt="Descárgala en App Store"
                className="app-banner-store-img"
                loading="lazy"
              />
            </a>
          </div>
        </section>
      </main>

      {showGuias && (
        <GuiasModal
          rol={rol}
          onClose={() => setShowGuias(false)}
        />
      )}

      {showLocations && (
        <LocationsModal
          rol={rol}
          onClose={() => setShowLocations(false)}
          onInscribirme={handleInscribirme}
        />
      )}

      {playingVideo && (
        <div className="overlay video-overlay" onClick={(e) => e.target === e.currentTarget && setPlayingVideo(null)}>
          <div className="video-modal">
            <div className="video-modal-head">
              <div className="video-modal-title">{playingVideo.titulo}</div>
              <button className="tarifa-close-btn" onClick={() => setPlayingVideo(null)} aria-label="Cerrar">×</button>
            </div>
            <div className="video-modal-body">
              <iframe
                src={`https://www.youtube.com/embed/${playingVideo.ytId}?autoplay=1`}
                title={playingVideo.titulo}
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowFullScreen
              />
            </div>
          </div>
        </div>
      )}

      <footer className="footer">© 2026 Zubale · Todos los derechos reservados</footer>

      <ChatBot />
    </>
  );
}

/* ─────────────────────────────────────────────────

   ───────────────────────────────────────────────── */
const GROQ_API_KEY = "";

/* ── Sesion unica para metricas ── */
const CHAT_SESSION_ID = "s_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);

/* ── Enviar metrica al sheet ── */
function trackMetrica(tipo, valor) {
  try {
    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action: "metrica", tipo, valor, sesion: CHAT_SESSION_ID }),
    });
  } catch (e) {}
}

/* ── Enviar registro al sheet ── */
function guardarRegistro(data) {
  return fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ action: "registro", ...data, sesion: CHAT_SESSION_ID }),
  }).then(r => r.json());
}

/* ── Cargar salas dinamicamente para inyectar al prompt ── */
async function cargarSalasParaPrompt() {
  try {
    const url = GAS_URL + (GAS_URL.includes("?") ? "&" : "?") + "sheet=Panel";
    const res = await fetch(url);
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) return "";
    const salas = [];
    for (const r of rows) {
      const kEstado = findKey(r, "estado");
      const kTienda = findKey(r, "sala", "tienda");
      const kRol = findKey(r, "servicio", "rol");
      const kComuna = findKey(r, "comuna");
      const kDireccion = findKey(r, "direcc", "address");
      const kForm = findKey(r, "form", "inscri", "postul");
      const estado = String(r[kEstado] || "").trim().toUpperCase();
      if (estado === "OFF") continue;
      const name = kTienda ? String(r[kTienda] || "").trim() : "";
      if (!name) continue;
      const rol = kRol ? String(r[kRol] || "").trim() : "";
      const comuna = kComuna ? String(r[kComuna] || "").trim() : "";
      const dir = kDireccion ? String(r[kDireccion] || "").trim() : "";
      const form = kForm ? String(r[kForm] || "").trim() : "";
      salas.push({ name, rol, comuna, dir, form });
    }
    if (salas.length === 0) return "";
    let txt = "\n\nSALAS DISPONIBLES (DATOS ACTUALIZADOS DESDE LA BASE DE DATOS):\n";
    txt += "(Usa SIEMPRE estos links, NO los que aparezcan arriba en el prompt base)\n\n";
    salas.forEach(s => {
      txt += "- **" + s.name + "**";
      if (s.rol) txt += " (" + s.rol + ")";
      if (s.comuna) txt += " — " + s.comuna;
      if (s.dir) txt += ", " + s.dir;
      if (s.form) txt += " → Inscribete aqui: [Postular a " + s.name + "](" + s.form + ")";
      txt += "\n";
    });
    return txt;
  } catch (e) {
    console.warn("[Zubale] Error cargando salas para prompt:", e);
    return "";
  }
}

/* ── Cargar prompt personalizado desde Config sheet ── */
async function cargarPromptCustom() {
  try {
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action: "leer_config", clave: "system_prompt" }),
    });
    const data = await res.json();
    if (data.valor && String(data.valor).trim().length > 50) return String(data.valor).trim();
    return null;
  } catch (e) {
    return null;
  }
}

/* ── Cargar FAQs desde Sheet ── */
var _faqsCache = [];
async function cargarFAQsDesdeSheet() {
  try {
    const url = GAS_URL + (GAS_URL.includes("?") ? "&" : "?") + "sheet=FAQs";
    const res = await fetch(url);
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) return [];
    const faqs = [];
    for (const r of rows) {
      const kP = findKey(r, "pregunta", "question");
      const kR = findKey(r, "respuesta", "answer");
      const kK = findKey(r, "keywords", "keyword");
      const pregunta = kP ? String(r[kP] || "").trim() : "";
      const respuesta = kR ? String(r[kR] || "").trim() : "";
      const keywords = kK ? String(r[kK] || "").trim().toLowerCase() : "";
      if (pregunta && respuesta) faqs.push({ pregunta, respuesta, keywords });
    }
    _faqsCache = faqs;
    return faqs;
  } catch (e) {
    return [];
  }
}

function buscarFAQsRelevantes(texto, maxResults) {
  if (!_faqsCache.length) return "";
  maxResults = maxResults || 8;
  var words = texto.toLowerCase().replace(/[^a-záéíóúñü\s]/g, "").split(/\s+/).filter(function(w) { return w.length > 2; });
  var stopwords = ["que","como","donde","cuando","cual","los","las","del","por","para","con","una","uno","the","hola","buenas","quiero","puedo","puede","tengo","saber","hacer","hay"];
  words = words.filter(function(w) { return stopwords.indexOf(w) === -1; });
  if (words.length === 0) return "";
  var scored = _faqsCache.map(function(faq) {
    var score = 0;
    var src = (faq.pregunta + " " + faq.keywords).toLowerCase();
    for (var i = 0; i < words.length; i++) {
      if (src.indexOf(words[i]) !== -1) score++;
    }
    return { faq: faq, score: score };
  }).filter(function(item) { return item.score > 0; });
  scored.sort(function(a, b) { return b.score - a.score; });
  var top = scored.slice(0, maxResults);
  if (top.length === 0) return "";
  var txt = "\n\nFAQs RELEVANTES (usa estas respuestas como referencia, adaptandolas a tu tono):\n\n";
  top.forEach(function(item) {
    txt += "P: " + item.faq.pregunta + "\nR: " + item.faq.respuesta + "\n\n";
  });
  return txt;
}

/* ── Detectar rol mencionado en texto ── */
function detectarRol(text) {
  const t = text.toLowerCase();
  if (/\bpicker\b/.test(t)) return "Picker";
  if (/\bshopper\b/.test(t)) return "Shopper";
  if (/\bdriver\b/.test(t)) return "Driver";
  return null;
}

/* ── Formatea markdown ligero a HTML para mensajes del bot ── */
function formatBotMessage(text) {
  let html = text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(?<!href=")(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

  const lines = html.split("\n");
  const result = [];
  let inList = false;
  for (const line of lines) {
    const trimmed = line.trim();
    const isBullet = /^[•\-]\s/.test(trimmed);
    if (isBullet) {
      if (!inList) { result.push("<ul>"); inList = true; }
      result.push("<li>" + trimmed.replace(/^[•\-]\s*/, "") + "</li>");
    } else {
      if (inList) { result.push("</ul>"); inList = false; }
      if (trimmed === "") {
        result.push("");
      } else {
        result.push("<p>" + trimmed + "</p>");
      }
    }
  }
  if (inList) result.push("</ul>");
  return result.filter(l => l !== "").join("");
}

function ChatBot() {
  const [isOpen, setIsOpen] = useState(false);
  const [messages, setMessages] = useState([
    { role: "bot", text: "¡Hola! Soy Zubalin 🧡 Tu asistente de Zubale Chile. ¿En qué te puedo ayudar? Puedo contarte sobre nuestros roles, ganancias, requisitos o cómo postular." }
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [dynamicPrompt, setDynamicPrompt] = useState("");
  const [regFlow, setRegFlow] = useState(null);
  const messagesEndRef = useRef(null);
  const inputRef = useRef(null);
  const sessionTracked = useRef(false);

  useEffect(() => {
    cargarFAQsDesdeSheet();
    Promise.all([cargarSalasParaPrompt(), cargarPromptCustom()]).then(([salasCtx, customPrompt]) => {
      let prompt = customPrompt || (typeof CHATBOT_SYSTEM_PROMPT !== "undefined" ? CHATBOT_SYSTEM_PROMPT : "");
      if (salasCtx) {
        prompt = prompt.replace(/SALAS DISPONIBLES \(con links[\s\S]*?(?=\n\nPRIMEROS PASOS|\n\nPROCESO DE|\n\nDATOS GENERALES|$)/, "") + salasCtx;
      }
      prompt += "\n\nREGISTRO DE USUARIOS:\nSi el usuario dice que quiere registrarse, postular, o inscribirse, ademas de darle los links, preguntale si quiere que lo guies paso a paso. Si dice que si, pidele sus datos uno por uno: nombre completo, RUT, telefono. Luego pregunta si ya descargo la app (si/no) y si ya se registro en ella (si/no). Confirma los datos antes de guardar.";
      setDynamicPrompt(prompt);
    });
  }, []);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, loading]);

  useEffect(() => {
    if (!loading && isOpen) {
      setTimeout(() => inputRef.current?.focus(), 50);
    }
  }, [loading, isOpen]);

  useEffect(() => {
    if (isOpen && !sessionTracked.current) {
      sessionTracked.current = true;
      trackMetrica("sesion_abierta", "1");
    }
  }, [isOpen]);

  const REG_STEPS = ["nombre", "rut", "telefono", "descargo_app", "se_registro", "confirmar"];
  const REG_QUESTIONS = {
    nombre: "¿Cuál es tu nombre completo?",
    rut: "¿Cuál es tu RUT? (ej: 12.345.678-9)",
    telefono: "¿Cuál es tu número de teléfono? (ej: +56 9 1234 5678)",
    descargo_app: "¿Ya descargaste la app de Zubale? (sí / no)",
    se_registro: "¿Ya te registraste en la app? (sí / no)",
  };

  const startRegistration = () => {
    setRegFlow({ step: 0, data: {} });
    setMessages(prev => [...prev, { role: "bot", text: "¡Genial! Te voy a ayudar con tu registro. " + REG_QUESTIONS.nombre }]);
    trackMetrica("registro_iniciado", "1");
  };

  const handleRegInput = (text) => {
    if (!regFlow) return false;
    const stepName = REG_STEPS[regFlow.step];
    if (stepName === "confirmar") {
      const t = text.toLowerCase();
      if (t.includes("si") || t.includes("sí") || t.includes("ok") || t.includes("correcto")) {
        guardarRegistro(regFlow.data);
        setMessages(prev => [...prev, { role: "user", text }, { role: "bot", text: "¡Listo! Tus datos han sido registrados exitosamente. Un ejecutivo se pondrá en contacto contigo si es necesario. ¿Hay algo más en lo que te pueda ayudar?" }]);
        trackMetrica("registro_completado", "1");
        setRegFlow(null);
        return true;
      } else {
        setMessages(prev => [...prev, { role: "user", text }, { role: "bot", text: "Entendido, vamos de nuevo. " + REG_QUESTIONS.nombre }]);
        setRegFlow({ step: 0, data: {} });
        return true;
      }
    }
    const newData = { ...regFlow.data, [stepName]: text };
    const nextStep = regFlow.step + 1;
    const nextStepName = REG_STEPS[nextStep];
    if (nextStepName === "confirmar") {
      const resumen = "Perfecto, confirma tus datos:\n\n• **Nombre:** " + newData.nombre + "\n• **RUT:** " + newData.rut + "\n• **Teléfono:** " + newData.telefono + "\n• **Descargó app:** " + newData.descargo_app + "\n• **Se registró:** " + newData.se_registro + "\n\n¿Están correctos? (sí / no)";
      setMessages(prev => [...prev, { role: "user", text }, { role: "bot", text: resumen }]);
      setRegFlow({ step: nextStep, data: newData });
      return true;
    }
    setMessages(prev => [...prev, { role: "user", text }, { role: "bot", text: REG_QUESTIONS[nextStepName] }]);
    setRegFlow({ step: nextStep, data: newData });
    return true;
  };

  const sendMessage = async () => {
    const text = input.trim();
    if (!text || loading) return;
    setInput("");

    if (regFlow !== null) {
      const handled = handleRegInput(text);
      if (handled) return;
    }

    const lower = text.toLowerCase();
    if ((lower.includes("registr") || lower.includes("inscrib") || lower.includes("quiero postular")) && !regFlow) {
      const wantsReg = lower.includes("registrarme") || lower.includes("inscribirme") || lower.includes("mis datos") || lower.includes("paso a paso");
      if (wantsReg) {
        setMessages(prev => [...prev, { role: "user", text }]);
        startRegistration();
        return;
      }
    }

    const userMsg = { role: "user", text };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setLoading(true);

    trackMetrica("pregunta", text.slice(0, 200));
    const rolDetected = detectarRol(text);
    if (rolDetected) trackMetrica("rol_consultado", rolDetected);

    try {
      var basePrompt = dynamicPrompt || (typeof CHATBOT_SYSTEM_PROMPT !== "undefined" ? CHATBOT_SYSTEM_PROMPT : "");
      var faqCtx = buscarFAQsRelevantes(text);
      const systemPrompt = basePrompt + faqCtx;
      const apiMessages = [
        { role: "system", content: systemPrompt },
        ...newMessages
          .filter((m, i) => !(i === 0 && m.role === "bot"))
          .map(m => ({
            role: m.role === "bot" ? "assistant" : "user",
            content: m.text,
          })),
      ];

      const useProxy = !GROQ_API_KEY;
      const fetchUrl = useProxy ? "/api/chat" : "https://api.groq.com/openai/v1/chat/completions";
      const fetchHeaders = { "Content-Type": "application/json" };
      if (!useProxy) fetchHeaders["Authorization"] = "Bearer " + GROQ_API_KEY;

      const res = await fetch(fetchUrl, {
        method: "POST",
        headers: fetchHeaders,
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: apiMessages,
          temperature: 0.3,
          max_tokens: 500,
        }),
      });

      const data = await res.json();
      if (data.error) throw new Error(data.error.message || "Error de API");

      const botText = data?.choices?.[0]?.message?.content
        || "Lo siento, no pude procesar tu consulta. Intenta de nuevo.";
      setMessages(prev => [...prev, { role: "bot", text: botText }]);

      if (botText.toLowerCase().includes("registr") && botText.toLowerCase().includes("paso a paso")) {
        setTimeout(() => {
          setMessages(prev => [...prev, {
            role: "bot",
            text: '¿Te gustaría que registre tus datos ahora? Escribe "quiero registrarme" para comenzar.',
          }]);
        }, 1000);
      }
    } catch (err) {
      console.error("Chatbot error:", err);
      setMessages(prev => [...prev, {
        role: "bot",
        text: "⚠️ Error: " + (err.message || "Hubo un error de conexión. Verifica tu API key e intenta de nuevo."),
      }]);
    } finally {
      setLoading(false);
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  return (
    <>
      {isOpen && (
        <div className="chat-window">
          <div className="chat-header">
            <div className="chat-header-avatar">🤖</div>
            <div className="chat-header-info">
              <div className="chat-header-name">Zubalin · Asistente Zubale</div>
              <div className="chat-header-status">En línea</div>
            </div>
            <button className="chat-header-close" onClick={() => setIsOpen(false)}>×</button>
          </div>
          <div className="chat-messages">
            {messages.map((m, i) => (
              m.role === "bot"
                ? <div key={i} className="chat-msg bot" dangerouslySetInnerHTML={{ __html: formatBotMessage(m.text) }} />
                : <div key={i} className="chat-msg user">{m.text}</div>
            ))}
            {loading && (
              <div className="chat-msg typing">
                <div className="typing-dot"></div>
                <div className="typing-dot"></div>
                <div className="typing-dot"></div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>
          <div className="chat-input-row">
            <input
              ref={inputRef}
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder={regFlow ? "Escribe tu respuesta..." : "Escribe tu pregunta..."}
              disabled={loading}
              autoFocus
            />
            <button
              onMouseDown={(e) => e.preventDefault()}
              onClick={() => { sendMessage(); inputRef.current?.focus(); }}
              disabled={loading || !input.trim()}
            >➤</button>
          </div>
        </div>
      )}
      <button
        className={"chat-fab" + (isOpen ? " open" : "")}
        onClick={() => setIsOpen(!isOpen)}
        aria-label={isOpen ? "Cerrar chat" : "Abrir chat de ayuda"}
      >
        {isOpen ? "×" : "💬"}
      </button>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
