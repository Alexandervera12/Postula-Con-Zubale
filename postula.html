<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zubale – Postula y empieza a ganar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:        #1557D6;
      --blue2:       #1B4FFF;
      --blue-light:  #DBEAFE;
      --blue-dark:   #0A1A6B;
      --blue-deeper: #0B3BAA;
      --gray:        #F3F6FA;
      --gray2:       #E5E7EB;
      --text:        #1A2340;
      --muted:       #6B7A9A;
      --white:       #FFFFFF;
      --success:     #10B981;
      --green-soft:  #D1FAE5;
      --warn-bg:     #FEF9C3;
      --warn-border: #FDE047;
      --warn-text:   #854D0E;
    }

    input, button, select, textarea { font-family: 'Lexend', 'Segoe UI', system-ui, sans-serif; }
    html, body {
      height: 100%;
      font-family: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--gray);
      color: var(--text);
      scroll-behavior: smooth;
    }
    #root { min-height: 100vh; }

    /* ── HEADER ── */
    .header {
      background: var(--white);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      box-shadow: 0 1px 0 var(--gray2);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-logo { display: flex; align-items: center; }
    .header-cta {
      background: var(--blue-light);
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 99px;
      border: 1px solid #BFDBFE;
      cursor: pointer;
      transition: all 0.2s;
    }
    .header-cta:hover { background: var(--blue); color: var(--white); }

    /* ── HERO (role selector) ── */
    .hero {
      background: linear-gradient(135deg, #1557D6 0%, #1B4FFF 60%, #2A68FF 100%);
      color: var(--white);
      padding: 56px 24px 64px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
      top: -200px; left: -200px;
      pointer-events: none;
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      bottom: -200px; right: -200px;
      pointer-events: none;
    }
    .hero-inner {
      position: relative;
      z-index: 2;
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
    }
    .hero-copy { text-align: left; flex: 1 1 auto; max-width: 640px; }
    .hero h1 {
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 900;
      margin-bottom: 10px;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }
    .hero p {
      font-size: clamp(14px, 2vw, 17px);
      opacity: 0.9;
      max-width: 580px;
      margin: 0 0 32px;
      line-height: 1.55;
    }

    /* ── HERO VISUAL (rotating people) ── */
    .hero-visual {
      position: relative;
      flex: 0 0 340px;
      width: 340px;
      height: 340px;
      pointer-events: none;
    }
    .hero-visual::before {
      /* soft glow circle behind the person */
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.10) 55%, transparent 75%);
    }
    .hero-visual::after {
      /* thin decorative ring */
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px dashed rgba(255,255,255,0.35);
      animation: heroRing 40s linear infinite;
    }
    @keyframes heroRing { to { transform: rotate(360deg); } }
    .hero-slide {
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      max-width: 88%;
      max-height: 96%;
      object-fit: contain;
      opacity: 0;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,0.28));
      animation: heroFade 13.5s ease-in-out infinite;
    }
    .hero-slide.s2 { animation-delay: 4.5s; }
    .hero-slide.s3 { animation-delay: 9s; }
    @keyframes heroFade {
      0%   { opacity: 0; transform: translateX(-50%) translateY(14px) scale(0.97); }
      6%   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      31%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      37%  { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.98); }
      100% { opacity: 0; transform: translateX(-50%) translateY(14px) scale(0.97); }
    }

    /* ── FLOATING BENEFIT BADGES ── */
    .hero-badge {
      position: absolute;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: var(--white);
      background: linear-gradient(135deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.10) 100%);
      border: 1px solid rgba(255,255,255,0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 26px rgba(0,0,0,0.20);
      white-space: nowrap;
      animation: badgeFloat 5s ease-in-out infinite;
    }
    .hero-badge .bi { font-size: 15px; line-height: 1; }
    .hero-badge.b1 { top: 6%; left: -14%; rotate: -6deg; }
    .hero-badge.b2 { top: 34%; right: -18%; rotate: 5deg; animation-delay: 1.2s; }
    .hero-badge.b3 { bottom: 16%; left: -20%; rotate: 4deg; animation-delay: 2.4s; }
    .hero-badge.b4 { bottom: -3%; right: -8%; rotate: -4deg; animation-delay: 3.4s; }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }
    @media (max-width: 900px) {
      .hero-badge { font-size: 11px; padding: 7px 12px; }
      .hero-badge.b1 { left: -10%; }
      .hero-badge.b2 { right: -12%; }
      .hero-badge.b3 { left: -14%; }
      .hero-badge.b4 { right: -6%; }
    }
    @media (max-width: 900px) {
      .hero-inner { flex-direction: column; gap: 28px; }
      .hero-copy { text-align: center; }
      .hero p { margin: 0 auto 32px; }
      .hero-visual { flex-basis: auto; width: 260px; height: 260px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-visual::after { animation: none; }
      .hero-slide { animation: none; }
      .hero-slide.s1 { opacity: 1; }
      .hero-badge { animation: none; }
    }

    /* ── ROLE PILLS ── */
    .role-pills {
      display: inline-flex;
      gap: 10px;
      padding: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 99px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    @media (max-width: 560px) {
      .role-pills { flex-wrap: wrap; justify-content: center; border-radius: 24px; }
    }
    .role-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 32px;
      border-radius: 99px;
      font-size: 15px;
      font-weight: 800;
      color: var(--white);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(.4,0,.2,1);
      letter-spacing: 0.3px;
      min-width: 120px;
    }
    .role-pill:hover { background: rgba(255,255,255,0.14); }
    .role-pill.active {
      background: var(--white);
      color: var(--blue);
      box-shadow: 0 6px 22px rgba(0,0,0,0.18);
      transform: scale(1.02);
    }

    /* ── MAIN CONTENT ── */
    .main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px 60px;
      position: relative;
      z-index: 5;
    }

    /* ── TIMELINE CARD ── */
    .timeline-card {
      max-width: 1100px;
      margin: 10px auto 32px;
      padding: 0 20px;
      position: relative;
      z-index: 2;
    }
    .timeline-card-inner {
      background: var(--white);
      border-radius: 20px;
      padding: 28px 32px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .timeline-title {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 24px;
    }
    .timeline-track {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 6px 30px 0 6px;
    }
    .timeline-track::before {
      content: "";
      position: absolute;
      top: 26px;
      left: 40px;
      right: 22px;
      height: 3px;
      background: linear-gradient(90deg, var(--blue-light), var(--blue));
      border-radius: 2px 0 0 2px;
      z-index: 0;
    }
    .tl-node {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      cursor: pointer;
      min-width: 0;
    }
    .tl-dot {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--white);
      border: 2.5px solid var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
      flex-shrink: 0;
    }
    .tl-dot svg {
      width: 18px; height: 18px;
      stroke: var(--blue);
      fill: none;
      transition: stroke 0.2s;
    }
    .tl-node:hover .tl-dot {
      transform: scale(1.08);
      box-shadow: 0 0 0 4px rgba(21,87,214,0.08);
    }
    .tl-node.active .tl-dot {
      background: var(--blue);
      border-color: var(--blue);
      transform: scale(1.15);
      box-shadow: 0 0 0 6px rgba(21,87,214,0.15);
    }
    .tl-node.active .tl-dot svg { stroke: var(--white); }
    .tl-label {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
      line-height: 1.3;
      max-width: 100px;
      transition: color 0.2s;
    }
    .tl-node.active .tl-label { color: var(--blue); }
    /* Detail panel below track */
    .tl-detail {
      margin-top: 20px;
      padding: 18px 22px;
      background: var(--gray);
      border-radius: 14px;
      animation: fadeSlideIn 0.25s ease;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tl-detail-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .tl-detail-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    .tl-detail .app-btns {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .tl-detail .app-btns a img {
      height: 38px;
      border-radius: 6px;
    }
    /* Arrow at end of timeline line */
    .tl-arrow {
      position: absolute;
      top: 20px;
      right: 10px;
      width: 0; height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 12px solid var(--blue);
      z-index: 1;
    }
    /* Action buttons in detail panel */
    .tl-detail-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .tl-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--blue);
      background: var(--white);
      color: var(--blue);
      font-family: 'Lexend', sans-serif;
      transition: all 0.2s;
    }
    .tl-action-btn:hover {
      background: var(--blue-light);
    }
    .tl-action-btn svg {
      width: 18px; height: 18px;
      flex-shrink: 0;
    }
    .tl-action-video {
      background: #FF0000;
      color: var(--white);
      border-color: #FF0000;
    }
    .tl-action-video:hover {
      background: #CC0000;
    }
    .tl-action-video svg {
      fill: var(--white);
    }
    @media (max-width: 640px) {
      .timeline-card-inner { padding: 20px 10px 18px; }
      .timeline-track {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        justify-content: flex-start;
        gap: 0;
        padding: 0 40px 10px 6px;
        scrollbar-width: none;
      }
      .timeline-track::-webkit-scrollbar { display: none; }
      .timeline-track::before {
        left: 20px;
        right: 30px;
      }
      .tl-node {
        flex: 0 0 auto;
        min-width: 80px;
      }
      .tl-label { font-size: 10px; max-width: 72px; }
      .tl-dot { width: 36px; height: 36px; }
      .tl-dot svg { width: 16px; height: 16px; }
      .tl-arrow { top: 16px; right: 14px; border-left-width: 10px; border-top-width: 6px; border-bottom-width: 6px; }
      .tl-detail { padding: 14px 16px; }
      .tl-action-btn { font-size: 12px; padding: 8px 12px; }
      .tl-detail .app-btns a img { height: 34px; }
    }

    /* SPLIT CONTENT */
    .split-wrap {
      display: grid;
      grid-template-columns: 1.55fr minmax(320px, 1fr);
      gap: 22px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .split-wrap { grid-template-columns: 1fr; }
    }

    /* ── LEFT: "Dónde puedes ser X" ── */
    .locations-card {
      background: linear-gradient(160deg, #0B3BAA 0%, #1557D6 55%, #1B4FFF 100%);
      color: var(--white);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(21,87,214,0.25);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 420px;
      cursor: pointer;
      transition: transform 0.28s cubic-bezier(.4,0,.2,1), box-shadow 0.28s;
    }
    .locations-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 26px 60px rgba(21,87,214,0.35);
    }
    .locations-card::before {
      content: "";
      position: absolute;
      width: 320px; height: 320px;
      background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none;
    }
    .locations-card::after {
      content: "";
      position: absolute;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      bottom: -60px; left: -60px;
      pointer-events: none;
    }
    .loc-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
      width: fit-content;
    }
    .loc-title {
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 900;
      line-height: 1.15;
      margin: 18px 0 10px;
      position: relative;
      z-index: 2;
    }
    .loc-sub {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.6;
      margin-bottom: 26px;
      position: relative;
      z-index: 2;
      max-width: 320px;
    }
    .loc-mini-list {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 26px;
    }
    .loc-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0.9;
    }
    .loc-mini-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #8FD7FF;
      box-shadow: 0 0 0 3px rgba(143,215,255,0.25);
    }
    .loc-cta {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--white);
      color: var(--blue);
      padding: 16px 22px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      width: 100%;
    }
    .loc-cta:hover { transform: scale(1.02); }
    .loc-cta-icon {
      display: inline-flex;
      width: 26px; height: 26px;
      background: var(--blue-light);
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* ── RIGHT: Info grid ── */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .info-card {
      background: var(--white);
      border-radius: 20px;
      padding: 26px 28px;
      box-shadow: 0 6px 22px rgba(21,87,214,0.08);
      border: 1.5px solid transparent;
      transition: all 0.28s cubic-bezier(.4,0,.2,1);
      position: relative;
      overflow: hidden;
    }
    .info-card:hover {
      border-color: var(--blue-light);
      box-shadow: 0 14px 36px rgba(21,87,214,0.15);
      transform: translateY(-2px);
    }
    .info-card-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .info-card-icon {
      width: 46px; height: 46px;
      border-radius: 13px;
      background: var(--blue-light);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .info-card-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }
    .info-card p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }
    .info-card ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .info-card li {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5;
    }
    .info-card li::before {
      content: "✓";
      flex-shrink: 0;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--green-soft);
      color: var(--success);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      margin-top: 1px;
    }

    /* Earnings specific */
    .earn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--gray);
      border-radius: 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .earn-row:hover { background: var(--blue-light); }
    .earn-label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .earn-value { font-size: 17px; font-weight: 900; color: var(--blue); }
    .earn-note {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
      font-style: italic;
      opacity: 0.75;
    }

    /* ── GUÍAS CARD (en info-grid, estilo blanco como .info-card) ── */
    .guias-card {
      position: relative;
      background: var(--white);
      color: var(--text);
      border-radius: 20px;
      padding: 26px 28px;
      box-shadow: 0 6px 22px rgba(21,87,214,0.08);
      border: 1.5px solid transparent;
      transition: all 0.28s cubic-bezier(.4,0,.2,1);
      overflow: hidden;
      cursor: pointer;
    }
    .guias-card:hover {
      border-color: var(--blue-light);
      box-shadow: 0 14px 36px rgba(21,87,214,0.15);
      transform: translateY(-2px);
    }
    .guias-card-bg { display: none; }
    .guias-card-content { position: relative; z-index: 2; }
    .guias-card-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .guias-card-icon {
      width: 46px; height: 46px;
      border-radius: 13px;
      background: var(--blue-light);

      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .guias-card-tag {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--blue);
      margin-bottom: 3px;
    }
    .guias-card-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);

    }
    .guias-card-sub {
      font-size: 14px;

    }
    .guias-card-btn {
      display: flex;

      width: 100%;
      padding: 12px 16px;
      background: var(--blue-light);

      border: none;

      font-size: 13px;
      font-weight: 800;

    }
    .guias-card-btn:hover {
      background: var(--blue);

      transform: translateX(2px);
      box-shadow: 0 6px 16px rgba(21,87,214,0.22);
    }

    /* ── GUÍAS MODAL ── */
    .guias-overlay { z-index: 240; }
    .guias-modal {
      background: var(--white);
      border-radius: 24px;
      width: 100%;
      max-width: 860px;
      max-height: 94vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 28px 70px rgba(0,0,0,0.35);
      animation: slideUp 0.32s cubic-bezier(.4,0,.2,1);
    }
    .guias-head {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: var(--white);
      padding: 22px 28px 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .guias-head-text { flex: 1; min-width: 0; }
    .guias-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: rgba(255,255,255,0.22);
      padding: 4px 11px;
      border-radius: 99px;
      margin-bottom: 8px;
    }
    .guias-title {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .guias-sub {
      font-size: 13px;
      opacity: 0.88;
      line-height: 1.45;
    }
    .guias-stage {
      position: relative;
      background: #0B3BAA;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 58px;
      min-height: 300px;
    }
    .guias-slide-wrap {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .guias-slide {
      width: 100%;
      height: auto;
      max-height: 62vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 18px 44px rgba(0,0,0,0.4);
      display: block;
    }
    .guias-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.95);
      color: var(--blue);
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      z-index: 3;
    }
    .guias-nav.prev { left: 14px; }
    .guias-nav.next { right: 14px; }
    .guias-nav:hover:not(.disabled) {
      background: var(--white);
      transform: translateY(-50%) scale(1.08);
    }
    .guias-nav.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .guias-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px 20px;
      background: var(--white);
      border-top: 1px solid var(--gray2);
      gap: 14px;
    }
    .guias-dots {
      display: flex;
      gap: 10px;
      flex: 1;
      justify-content: center;
    }
    .guias-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--gray2);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: all 0.2s;
    }
    .guias-dot:hover { background: var(--blue-light); }
    .guias-dot.active {
      background: var(--blue);
      width: 26px;
      border-radius: 99px;
    }
    .guias-counter {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      background: var(--gray);
      padding: 6px 12px;
      border-radius: 99px;
      flex-shrink: 0;
    }
    .guias-empty {
      padding: 60px 30px;
      text-align: center;
      background: var(--gray);
    }
    .guias-empty-icon { font-size: 46px; margin-bottom: 12px; }
    .guias-empty-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 6px;
    }
    .guias-empty-text {
      font-size: 14px;
      color: var(--muted);
      max-width: 360px;
      margin: 0 auto;
      line-height: 1.5;
    }
    /* Mobile-only nav wrapper (hidden by default) */
    .guias-mobile-nav { display: none; }
    @media (max-width: 780px) {
      .guias-overlay { padding: 10px; align-items: flex-start; overflow-y: auto; }
      .guias-modal {
        border-radius: 18px;
        max-height: none;
        height: auto;
        width: 100%;
        margin: 10px 0;
      }
      .guias-head { padding: 18px 20px 16px; gap: 12px; }
      .guias-title { font-size: 17px; }
      .guias-sub { font-size: 12px; }
      .guias-stage {
        padding: 14px 12px 18px;
        min-height: auto;
        flex-direction: column;
        gap: 14px;
      }
      .guias-slide-wrap {
        width: 100%;
        max-width: 100%;
      }
      .guias-slide {
        width: 100%;
        max-width: 100%;
        height: auto;
        max-height: none;
        border-radius: 10px;
        display: block;
      }
      /* Hide desktop absolute-positioned nav buttons on mobile */
      .guias-stage > .guias-nav { display: none; }
      /* Show mobile row of nav buttons below slide */
      .guias-mobile-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        width: 100%;
      }
      .guias-mobile-nav .guias-nav {
        position: static;
        transform: none;
        width: 44px;
        height: 44px;
        font-size: 26px;
      }
      .guias-mobile-nav .guias-nav:hover:not(.disabled) {
        transform: scale(1.06);
      }
      .guias-footer { padding: 12px 16px 16px; }
      .guias-dot { width: 8px; height: 8px; }
      .guias-dot.active { width: 22px; }
      .guias-counter { font-size: 11px; padding: 5px 10px; }
    }

    /* ── GEO SPINNER ── */
    .geo-spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2.2px solid rgba(4,120,87,0.25);
      border-top-color: #047857;
      border-radius: 50%;
      animation: geoSpin 0.9s linear infinite;
    }
    @keyframes geoSpin { to { transform: rotate(360deg); } }

    /* ── STORE MAP MODAL (mini-mapa por local) ── */
    .store-map-overlay { z-index: 260; }
    .tarifa-overlay    { z-index: 320; }
    .store-map-modal {
      background: var(--white);
      border-radius: 24px;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 28px 70px rgba(0,0,0,0.35);
      animation: slideUp 0.32s cubic-bezier(.4,0,.2,1);
    }
    .store-map-head {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: var(--white);
      padding: 22px 24px 18px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .store-map-head-text { flex: 1; min-width: 0; }
    .store-map-city-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      background: rgba(255,255,255,0.22);
      padding: 4px 10px;
      border-radius: 99px;
      margin-bottom: 8px;
    }
    .store-map-title {
      font-size: 20px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 4px;
      overflow-wrap: break-word;
    }
    .store-map-addr {
      font-size: 13px;
      opacity: 0.88;
      font-weight: 500;
      line-height: 1.45;
      overflow-wrap: break-word;
    }
    .store-map-container {
      width: 100%;
      height: 380px;
      min-height: 260px;
      background: #e5ecf5;
      flex: 1;
      position: relative;
    }
    .store-map-container .leaflet-container {
      width: 100%;
      height: 100%;
      font-family: 'Lexend', sans-serif;
      background: #e5ecf5;
    }
    .store-map-footer {
      padding: 16px 22px 20px;
      background: var(--white);
      border-top: 1px solid var(--gray2);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .store-map-inscribir {
      width: 100%;
      justify-content: center;
    }
    .store-map-tarifa {
      width: 100%;
      justify-content: center;
      flex: none;
    }
    @media (max-width: 780px) {
      .store-map-modal {
        max-width: 100%;
        border-radius: 18px;
        max-height: 94vh;
      }
      .store-map-head { padding: 18px 20px 16px; }
      .store-map-title { font-size: 17px; }
      .store-map-addr { font-size: 12px; }
      .store-map-container { height: 56vh; min-height: 260px; }
      .store-map-footer { padding: 14px 18px 16px; }
    }

    /* ── FAQs ── */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .faqs-card {
      background: var(--white);
      border-radius: 24px;
      padding: 28px 28px 20px;
      box-shadow: 0 6px 22px rgba(21,87,214,0.08);
      border: 1.5px solid var(--gray2);
    }
    .faqs-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .faqs-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--blue-light);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      flex-shrink: 0;
    }
    .faqs-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.2;
    }
    .faqs-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 500;
    }
    .faq-item {
      border-top: 1px solid var(--gray2);
      padding: 14px 0;
      cursor: pointer;
    }
    .faq-item:last-child { padding-bottom: 4px; }
    .faq-q {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      transition: color 0.2s;
    }
    .faq-item:hover .faq-q { color: var(--blue); }
    .faq-chev {
      flex-shrink: 0;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--blue-light);
      color: var(--blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1), background 0.2s;
    }
    .faq-item.open .faq-chev {
      transform: rotate(45deg);
      background: var(--blue);
      color: var(--white);
    }
    .faq-a-wrap {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(.4,0,.2,1);
    }
    .faq-item.open .faq-a-wrap { max-height: 260px; }
    .faq-a {
      padding-top: 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── APP DOWNLOAD BANNER (compacto, al final) ── */
    .app-banner {
      margin: 28px auto 0;
      max-width: 720px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(21,87,214,0.15);
      position: relative;
    }
    .app-banner-img-link {
      display: block;
      line-height: 0;
    }
    .app-banner-img {
      width: 100%;
      height: auto;
      display: block;
    }
    .app-banner-stores {
      display: flex;
      gap: 14px;
      justify-content: center;
      align-items: center;
      padding: 16px 18px 18px;
      flex-wrap: wrap;
      background: var(--white);
      border-top: 1px solid var(--gray2);
    }
    .app-banner-store-link {
      display: inline-block;
      line-height: 0;
      transition: transform 0.2s;
      border-radius: 10px;
    }
    .app-banner-store-link:hover {
      transform: translateY(-2px);
    }
    .app-banner-store-img {
      height: 46px;
      width: auto;
      display: block;
    }
    @media (max-width: 780px) {
      .app-banner {
        margin-top: 22px;
        max-width: 100%;
        border-radius: 14px;
      }
      .app-banner-stores {
        padding: 14px 12px 16px;
        gap: 10px;
      }
      .app-banner-store-img {
        height: 40px;
      }
    }

    /* ── FINAL CTA ── */
    .final-cta-wrap {
      margin-top: 46px;
      background: var(--white);
      border-radius: 24px;
      padding: 42px 32px;
      text-align: center;
      box-shadow: 0 6px 24px rgba(21,87,214,0.10);
      position: relative;
      overflow: hidden;
      border: 1.5px solid var(--blue-light);
    }
    .final-cta-wrap h3 {
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 900;
      color: var(--text);
      margin-bottom: 10px;
    }
    .final-cta-wrap p {
      font-size: 15px;
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto 24px;
      line-height: 1.55;
    }
    .final-cta-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    @media (max-width: 560px) {
      .final-cta-buttons { flex-direction: column; align-items: stretch; }
      .final-cta-buttons .btn-primary { width: 100%; }
    }
    .btn-primary {
      padding: 16px 32px;
      border-radius: 14px;
      border: none;
      background: var(--blue);
      color: var(--white);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 22px rgba(21,87,214,0.35);
      font-family: inherit;
      letter-spacing: 0.3px;
    }
    .btn-primary:hover { background: var(--blue2); transform: translateY(-1px); box-shadow: 0 10px 30px rgba(21,87,214,0.45); }
    .btn-primary:active { transform: scale(0.98); }

    /* ── MODAL OVERLAY ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(10,26,107,0.55);
      backdrop-filter: blur(5px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
      overscroll-behavior: contain;
      overflow-y: auto;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-locations {
      background: var(--white);
      border-radius: 24px;
      width: 100%;
      max-width: 1360px;
      max-height: 94vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 28px 70px rgba(0,0,0,0.3);
      animation: slideUp 0.32s cubic-bezier(.4,0,.2,1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-head {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: var(--white);
      padding: 26px 28px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .modal-head h2 {
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .modal-head p { font-size: 13px; opacity: 0.85; }
    .modal-close {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: none;
      color: var(--white);
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .modal-close:hover { background: rgba(255,255,255,0.3); transform: rotate(90deg); }

    .modal-search-row {
      padding: 20px 28px 8px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      background: var(--white);
    }
    @media (max-width: 640px) {
      .modal-search-row { grid-template-columns: 1fr; }
    }
    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border: 2px solid var(--gray2);
      border-radius: 14px;
      background: var(--white);
      transition: all 0.2s;
      padding-left: 14px;
    }
    .search-wrap:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21,87,214,0.12);
    }
    .search-wrap svg { flex-shrink: 0; color: var(--muted); }
    .search-wrap input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 14px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      background: transparent;
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .btn-geo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 18px;
      border-radius: 12px;
      border: 2px solid var(--success);
      background: var(--green-soft);
      color: #047857;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-geo:hover { background: var(--success); color: var(--white); transform: translateY(-1px); }

    .modal-body {
      display: grid;
      grid-template-columns: 210px 400px 1fr;
      gap: 0;
      overflow: hidden;
      flex: 1;
      min-height: 560px;
    }
    @media (max-width: 1200px) {
      .modal-body { grid-template-columns: 200px 360px 1fr; min-height: 520px; }
    }
    @media (max-width: 980px) {
      .modal-body { grid-template-columns: 190px 320px 1fr; min-height: 480px; }
    }
    @media (max-width: 880px) {
      .modal-body { grid-template-columns: 1fr 1.2fr; }
      .map-col { grid-column: 1 / -1; min-height: 300px; border-top: 1px solid var(--gray2); border-left: none; }
    }

    /* Mobile helpers (hidden by default) */
    .mobile-cities-scroll { display: none; }
    .mobile-filters-row { display: none; }
    .mobile-tabs { display: none; }

    @media (max-width: 780px) {
      .modal-locations { border-radius: 18px; max-height: 96vh; }
      .modal-head { padding: 20px 22px 18px; }
      .modal-head h2 { font-size: 18px; }
      .modal-head p { font-size: 12px; }
      .modal-search-row { padding: 14px 18px 6px; }
      .search-wrap input { padding: 12px 12px; font-size: 14px; }
      .btn-geo { padding: 12px 14px; font-size: 12px; }

      /* Hide old horizontal chips */
      .mobile-cities-scroll { display: none; }

      /* Mobile dropdown filters row (Region + Retail) */
      .mobile-filters-row {
        display: flex;
        gap: 10px;
        padding: 12px 18px;
        background: var(--gray);
        border-bottom: 1px solid var(--gray2);
      }
      .mobile-filter-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .mobile-filter-label {
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
      }
      .mobile-filter-select {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid var(--gray2);
        border-radius: 10px;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        background: var(--white);
        cursor: pointer;
        outline: none;
        appearance: auto;
        transition: border-color 0.2s;
      }
      .mobile-filter-select:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(21,87,214,0.12);
      }

      /* Hide desktop retail filter inside stores-col on mobile */
      .retail-filter-row { display: none; }

      /* Tabs Lista / Mapa */
      .mobile-tabs {
        display: flex;
        gap: 0;
        background: var(--white);
        border-bottom: 1px solid var(--gray2);
        padding: 0 18px;
      }
      .mobile-tab {
        flex: 1;
        padding: 13px 8px;
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .mobile-tab.active {
        color: var(--blue);
        border-bottom-color: var(--blue);
      }

      .mobile-tabs { display: flex !important; }
      .modal-body {
        display: block;
        position: relative;
        overflow: hidden;
        min-height: auto;
        height: auto;
      }
      .cities-col { display: none; }
      .map-col {
        display: none !important;
        height: 55vh;
        width: 100%;
        border: none;
      }
      .modal-body.mobile-show-mapa .map-col {
        display: block !important;
      }
      .modal-body.mobile-show-mapa .stores-col {
        display: none !important;
      }
      .stores-col {
        position: static;
        width: 100%;
        max-height: 54vh;
        min-height: 40vh;
        overflow-y: auto;
        padding: 14px 16px 20px;
        border: none !important;
      }
    }

    .cities-col {
      border-right: 1px solid var(--gray2);
      overflow-y: auto;
      padding: 14px 16px 24px;
      background: var(--gray);
    }
    @media (max-width: 780px) {
      .cities-col {
        border-right: none;
        border-bottom: 1px solid var(--gray2);
        max-height: 180px;
      }
    }
    .cities-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 6px 10px 10px;
    }
    .city-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: all 0.18s;
      margin-bottom: 4px;
      border: 1.5px solid transparent;
    }
    .city-item:hover { background: var(--white); }
    .city-item.active {
      background: var(--white);
      border-color: var(--blue);
      color: var(--blue);
      box-shadow: 0 4px 14px rgba(21,87,214,0.12);
    }
    .city-count {
      font-size: 11px;
      font-weight: 700;
      background: var(--blue-light);
      color: var(--blue);
      padding: 2px 8px;
      border-radius: 99px;
    }
    .city-item.active .city-count { background: var(--blue); color: var(--white); }

    .stores-col {
      overflow-y: auto;
      padding: 18px 24px 28px;
      background: var(--white);
    }
    .stores-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--blue-light);
    }
    .stores-head h3 {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }
    .stores-head span {
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
      background: var(--blue-light);
      padding: 4px 12px;
      border-radius: 99px;
    }

    /* Retail filter dropdown */
    .retail-filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 0 2px;
    }
    .retail-filter-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }
    .retail-filter-select {
      flex: 1;
      max-width: 220px;
      padding: 8px 12px;
      border: 1.5px solid var(--gray2);
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      background: var(--white);
      cursor: pointer;
      transition: border-color 0.2s;
      outline: none;
      appearance: auto;
    }
    .retail-filter-select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21,87,214,0.12);
    }

    .store-row {
      background: var(--white);
      border: 1.5px solid var(--gray2);
      border-radius: 14px;
      padding: 14px 16px 14px 14px;
      margin-bottom: 10px;
      transition: all 0.24s cubic-bezier(.4,0,.2,1);
    }
    .store-row:hover {
      border-color: var(--blue);
      box-shadow: 0 6px 20px rgba(21,87,214,0.12);
      transform: translateX(3px);
    }
    .store-row-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .store-row-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--blue-light);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .store-row-main {
      flex: 1;
      min-width: 0;
    }
    .store-row-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      overflow-wrap: break-word;
      hyphens: auto;
      padding-top: 2px;
    }
    .store-row-addr {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      margin-top: 3px;
      line-height: 1.45;
      overflow-wrap: break-word;
    }
    .store-row-maplink {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      background: var(--blue-light);
      border: none;
      color: var(--blue);
      font-size: 11.5px;
      font-weight: 800;
      padding: 5px 11px 5px 9px;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.2s;
      line-height: 1.2;
    }
    .store-row-maplink:hover {
      background: var(--blue);
      color: var(--white);
      transform: translateY(-1px);
    }
    .store-row-maplink svg { flex-shrink: 0; }
    .store-row-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--gray);
      border: none;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      height: fit-content;
      margin-top: 4px;
      white-space: nowrap;
    }
    .store-row-toggle:hover { background: var(--blue-light); }
    .store-row-toggle .chev {
      display: inline-block;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      font-size: 10px;
    }
    .store-row-toggle.open .chev { transform: rotate(180deg); }

    .store-row-expand {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(.4,0,.2,1), margin-top 0.3s;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .store-row-expand.open {
      max-height: 220px;
      margin-top: 14px;
    }
    .tarifa-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: var(--white);
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 18px rgba(21,87,214,0.3);
      flex: 1 1 auto;
      justify-content: center;
      line-height: 1.2;
      white-space: nowrap;
    }
    .tarifa-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(21,87,214,0.4); }

    /* ── MAP COLUMN ── */
    .map-col {
      position: relative;
      background: var(--gray);
      border-left: 1px solid var(--gray2);
      overflow: hidden;
    }
    .map-col .leaflet-container {
      width: 100%;
      height: 100%;
      font-family: 'Lexend', sans-serif;
      background: #e5ecf5;
    }
    .map-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 500;
      background: var(--white);
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 99px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    /* Custom Leaflet marker */
    .zbl-marker-wrap {
      position: relative;
      width: 38px;
      height: 46px;
    }
    .zbl-marker {
      position: absolute;
      top: 0; left: 0;
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 6px 18px rgba(21,87,214,0.45);
      border: 3px solid var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(.4,0,.2,1);
    }
    .zbl-marker-inner {
      transform: rotate(45deg);
      font-size: 16px;
    }
    .zbl-marker-wrap:hover .zbl-marker,
    .zbl-marker-wrap.active .zbl-marker {
      transform: rotate(-45deg) scale(1.15);
    }
    .zbl-marker-wrap.active .zbl-marker {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      box-shadow: 0 8px 22px rgba(16,185,129,0.5);
    }

    /* Leaflet popup override */
    .leaflet-popup-content-wrapper {
      border-radius: 14px !important;
      padding: 2px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2) !important;
    }
    .leaflet-popup-content {
      margin: 14px 16px !important;
      font-family: 'Lexend', sans-serif !important;
      min-width: 200px;
    }
    .leaflet-popup-tip { box-shadow: 0 10px 30px rgba(0,0,0,0.2) !important; }
    .popup-store-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 4px;
    }
    .popup-store-addr {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .popup-inscribirme {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: var(--white) !important;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Lexend', sans-serif;
      text-align: center;
      text-decoration: none;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(21,87,214,0.3);
    }
    .popup-inscribirme:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(21,87,214,0.4);
    }
    .popup-tarifa-btn {
      display: block;
      width: 100%;
      background: rgba(91,33,182,0.08);
      color: var(--blue);
      border: 1.5px solid var(--blue);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Lexend', sans-serif;
      text-align: center;
      margin-bottom: 6px;
      transition: all 0.2s;
    }
    .popup-tarifa-btn:hover {
      background: var(--blue);
      color: var(--white);
    }
    .popup-tarifa-link {
      display: block;
      margin-top: 8px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      cursor: pointer;
      text-decoration: underline;
    }

    /* Inscribirme button (store row) */
    .inscribirme-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: var(--white);
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 18px rgba(16,185,129,0.35);
      flex: 1 1 auto;
      justify-content: center;
      text-decoration: none;
      text-align: center;
      line-height: 1.2;
    }
    .inscribirme-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(16,185,129,0.45);
    }

    .store-row.selected {
      border-color: #10B981;
      background: #ECFDF5;
      box-shadow: 0 6px 18px rgba(16,185,129,0.15);
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 40px; margin-bottom: 10px; }
    .empty-title { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .empty-text { font-size: 13px; }

    /* ── TARIFAS MODAL (imagen desde Drive) ── */
    .tarifa-modal-img {
      width: 95vw;
      max-width: 700px;
      animation: slideUp 0.32s cubic-bezier(.4,0,.2,1);
      filter: drop-shadow(0 28px 40px rgba(0,0,0,0.25));
    }
    .tarifa-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--blue);
      border-radius: 20px 20px 0 0;
      gap: 12px;
    }
    .tarifa-modal-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--white);
    }
    .tarifa-close-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: none;
      color: var(--white);
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .tarifa-close-btn:hover { background: rgba(255,255,255,0.35); transform: rotate(90deg); }
    .tarifa-img-wrap {
      position: relative;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      border-radius: 0 0 20px 20px;
      overflow: hidden;
    }
    .tarifa-iframe {
      width: 100%;
      height: 75vh;
      max-height: 700px;
      border: none;
      display: block;
      transition: opacity 0.3s;
    }
    .tarifa-loading {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
    }
    /* Mobile: tarifa modal fullscreen */
    @media (max-width: 640px) {
      .tarifa-modal-img {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }
      .tarifa-iframe {
        height: calc(100vh - 60px);
        max-height: none;
      }
      .tarifa-modal-head {
        padding: 12px 16px;
      }
      .tarifa-modal-title {
        font-size: 15px;
      }
      .tarifa-overlay {
        padding: 0;
      }
    }

    /* ── VER TARIFAS BUTTON ── */
    .ver-tarifas-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1.5px solid var(--blue);
      background: rgba(91,33,182,0.06);
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ver-tarifas-btn:hover {
      background: var(--blue);
      color: var(--white);
    }
    .store-row-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 2px 0;
      width: 100%;
    }

    /* ── SHEET LOADING / ERROR ── */
    .sheet-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 48px 20px;
      font-size: 14px;
      color: var(--muted);
    }
    .sheet-error {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      font-size: 14px;
      color: #b91c1c;
      background: #fef2f2;
      border-radius: 10px;
      margin: 12px 16px;
    }

    /* Fade in classes for animations */
    .fade-in {
      animation: fadeInUp 0.4s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger-1 { animation-delay: 0.05s; }
    .stagger-2 { animation-delay: 0.12s; }
    .stagger-3 { animation-delay: 0.20s; }

    /* ── Video card ── */
    .video-card {
      background: var(--white);
      border-radius: 18px;
      box-shadow: 0 2px 12px rgba(21,87,214,0.07);
      overflow: hidden;
    }
    .video-card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 14px;
    }
    .video-card-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #FF0000 0%, #CC0000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      font-weight: 900;
    }
    .video-card-title { font-size: 16px; font-weight: 800; color: var(--text); }
    .video-card-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .video-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      background: #0a0a0a;
    }
    .video-embed iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .video-thumb-link {
      display: block;
      position: relative;
      width: 100%;
      border-radius: 0 0 16px 16px;
      overflow: hidden;
      cursor: pointer;
    }
    .video-thumb-img {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    .video-thumb-play {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px;
      background: rgba(255,0,0,0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }
    .video-thumb-link:hover .video-thumb-play {
      transform: translate(-50%, -50%) scale(1.12);
    }
    /* ── VIDEO PLAYER MODAL ── */
    .video-overlay { z-index: 310; }
    .video-modal {
      width: 95vw;
      max-width: 800px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      animation: slideUp 0.3s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 28px 70px rgba(0,0,0,0.5);
    }
    .video-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--blue);
      gap: 12px;
    }
    .video-modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--white);
    }
    .video-modal-body {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
    }
    .video-modal-body iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    @media (max-width: 640px) {
      .video-modal {
        width: 100vw;
        max-width: 100vw;
        border-radius: 0;
      }
      .video-overlay { padding: 0; align-items: center; }
    }
    .video-placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: rgba(255,255,255,0.7);
      gap: 10px;
    }
    .video-placeholder-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 2px solid rgba(255,255,255,0.15);
    }
    .video-placeholder-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .video-placeholder-sub {
      font-size: 11px;
      opacity: 0.5;
    }

    /* Footer */
    .footer { text-align: center; padding: 26px 20px; color: var(--muted); font-size: 12px; }

    /* ── CHATBOT WIDGET ── */
    .chat-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 600;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: #fff;
      border: none;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(21,87,214,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }
    .chat-fab:hover { transform: scale(1.08); box-shadow: 0 12px 36px rgba(21,87,214,0.55); }
    .chat-fab.open { border-radius: 14px; }

    .chat-window {
      position: fixed;
      bottom: 96px;
      right: 24px;
      z-index: 500;
      width: 380px;
      max-height: 520px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 60px rgba(21,87,214,0.25), 0 0 0 1px rgba(21,87,214,0.08);
      overflow: hidden;
      animation: chatSlideUp 0.3s cubic-bezier(.4,0,.2,1);
    }
    @keyframes chatSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .chat-header {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: #fff;

      height: 8px;

    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

function driveToPreviewUrl(link) {
  if (!link) return null;
  const s = String(link).trim();
  if (!s) return null;
  let m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  if (s.startsWith("http")) return s;
  return null;
}

function driveToDirectImageUrl(link) {
  if (!link) return null;

  let m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (!m) m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);

    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/^(v+i*|iv|ix|x+i*|xi+|[0-9]+)\s+region\s+(de(l)?\s+)?/i, "")
    .replace(/region\s+(de(l)?\s+)?/i, "")
    .trim();
  for (const [k, v] of Object.entries(REGION_CENTERS)) {
    const kn = k.normalize("NFD").replace(/[̀-ͯ]/g, "");
    if (clean.includes(kn) || kn.includes(clean)) return v;
  }
  return { center: [-33.45, -70.67], zoom: 10 };
}

function findKey(obj, ...needles) {
  const keys = Object.keys(obj);
  for (const needle of needles) {
    const found = keys.find(k => k.toLowerCase().includes(needle));
    if (found) return found;
  }
  return null;
}

async function fetchSalasFromSheet() {
  const url = GAS_URL + (GAS_URL.includes("?") ? "&" : "?") + "sheet=Panel";
  const res = await fetch(url);
  const rows = await res.json();

  if (!Array.isArray(rows) || rows.length === 0) return [];

  const sample = rows[0];
  const allKeys = Object.keys(sample);
  console.log("[Zubale] Columnas del Sheet:", allKeys);
  console.log("[Zubale] Primer registro:", JSON.stringify(sample));

  const kEstado    = findKey(sample, "estado");
  const kCliente   = findKey(sample, "cliente");
  const kTienda    = findKey(sample, "sala", "tienda");
  const kRol       = findKey(sample, "servicio", "rol");
  const kLat       = findKey(sample, "lat");
  const kLng       = findKey(sample, "long", "lng");
  const kComuna    = findKey(sample, "comuna");
  const kRegion    = findKey(sample, "region", "región");
  const kDireccion = findKey(sample, "direcc", "address");
  const kTarifa    = findKey(sample, "tarifa", "drive");

  const kTarifaFinal = kTarifa || allKeys[allKeys.length - 1];
  console.log("[Zubale] Columna tarifa detectada:", kTarifa, "→ usando:", kTarifaFinal);

  const salas = [];
  for (const r of rows) {
    const estado = String(r[kEstado] || "").trim().toUpperCase();
    if (estado === "OFF") continue;

    const name = String(r[kTienda] || "").trim();
    if (!name) continue;

    const lat = typeof r[kLat] === "number" ? r[kLat] : parseFloat(String(r[kLat]).replace(/,/g, ".")) || 0;
    const lng = typeof r[kLng] === "number" ? r[kLng] : parseFloat(String(r[kLng]).replace(/,/g, ".")) || 0;

    const rawTarifa = r[kTarifaFinal];
    const tarifaStr = (rawTarifa && typeof rawTarifa === "object") ? (rawTarifa.url || rawTarifa.toString()) : String(rawTarifa || "");

    const previewUrl = driveToPreviewUrl(tarifaStr);
    salas.push({
      name,
      cliente: String(r[kCliente] || "").trim(),
      rol: String(r[kRol] || "Picker").trim(),
      lat,
      lng,
      comuna: String(r[kComuna] || "").trim(),
      region: String(r[kRegion] || "Sin región").trim(),
      direccion: String(r[kDireccion] || "").trim(),
      tarifaLink: previewUrl,
    });
    if (previewUrl) console.log("[Zubale] ✅ Tarifa:", name, "→", previewUrl);
  }

  const regionMap = {};
  salas.forEach(s => {
    if (!regionMap[s.region]) {
      const rc = getRegionCenter(s.region);
      regionMap[s.region] = { nombre: s.region, center: rc.center, zoom: rc.zoom, salas: [] };
    }
    regionMap[s.region].salas.push(s);
  });

  return Object.values(regionMap).sort((a, b) => b.salas.length - a.salas.length);
}

   ───────────────────────────────────────────────── */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371; // km
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function youtubeIdFromUrl(url) {
  if (!url) return null;
  const s = String(url).trim();
  let m = s.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = s.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = s.match(/\/embed\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  return null;
}

async function fetchVideosFromSheet() {
  try {
    const url = GAS_URL + (GAS_URL.includes("?") ? "&" : "?") + "sheet=URL";
    const res = await fetch(url);
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) return [];
    const result = rows.map((r, i) => {
      const kTipo = findKey(r, "tipo", "titulo", "nombre");
      const kLink = findKey(r, "link", "url", "video");
      const titulo = kTipo ? String(r[kTipo] || "").trim() : "";
      const link   = kLink ? String(r[kLink] || "").trim() : "";
      return { titulo, link, ytId: youtubeIdFromUrl(link), rowIndex: i };
    }).filter(v => v.titulo && v.link);
    console.log("[Zubale] Videos/URLs cargados del sheet:", result);
    return result;
  } catch (err) {
    console.warn("[Zubale] Error cargando videos:", err);
    return [];
  }
}

/* ─────────────────────────────────────────────────
   MODAL: Búsqueda de salas por ciudad (con mapa real)
