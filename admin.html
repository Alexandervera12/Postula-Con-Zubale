<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel Admin — Zubale Chatbot</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --blue: #0a1a6b;
    --blue-light: #1557D6;
    --orange: #FF6B35;
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .topbar {
    background: var(--blue);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .topbar img { height: 28px; }
  .topbar h1 { font-size: 18px; font-weight: 600; }
  .topbar .back-link { color: #fff; text-decoration: none; font-size: 14px; margin-left: auto; opacity: 0.8; }
  .topbar .back-link:hover { opacity: 1; }

  .login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - 60px);
  }
  .login-card {
    background: var(--card); border-radius: var(--radius);
    padding: 40px; max-width: 380px; width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
  }
  .login-card h2 { margin-bottom: 8px; color: var(--blue); }
  .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .login-card input {
    width: 100%; padding: 12px 16px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 15px; margin-bottom: 16px;
  }
  .login-card button {
    width: 100%; padding: 12px; background: var(--blue); color: #fff;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .login-card button:hover { background: var(--blue-light); }
  .login-error { color: #dc2626; font-size: 13px; margin-bottom: 12px; }

  .dashboard { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .tabs { display: flex; gap: 4px; margin-bottom: 24px; background: var(--card); border-radius: var(--radius); padding: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .tab-btn {
    flex: 1; padding: 10px 16px; border: none; background: transparent;
    border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
    color: var(--muted); transition: all 0.2s;
  }
  .tab-btn.active { background: var(--blue); color: #fff; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--blue); }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .chart-card {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .chart-card h3 { font-size: 15px; margin-bottom: 12px; color: var(--text); }

  .table-card {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 24px; overflow-x: auto;
  }
  .table-card h3 { font-size: 15px; margin-bottom: 12px; }
  .table-card table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table-card th { background: var(--bg); padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); }
  .table-card td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .table-card tr:hover td { background: #f8fafc; }

  .prompt-editor {
    background: var(--card); border-radius: var(--radius); padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 24px;
  }
  .prompt-editor h3 { font-size: 16px; margin-bottom: 8px; }
  .prompt-editor p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .prompt-editor textarea {
    width: 100%; min-height: 400px; padding: 16px; border: 1px solid var(--border);
    border-radius: 8px; font-family: "Fira Code", "Consolas", monospace; font-size: 13px;
    line-height: 1.5; resize: vertical;
  }
  .prompt-actions { display: flex; gap: 12px; margin-top: 16px; align-items: center; }
  .prompt-actions button {
    padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-light); }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border) !important; }
  .save-status { font-size: 13px; color: #16a34a; }
  .save-error { font-size: 13px; color: #dc2626; }

  .loading-state { text-align: center; padding: 60px; color: var(--muted); }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .charts-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .dashboard { padding: 16px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <img src="https://www.zubale.com/cl/wp-content/uploads/2023/12/logo_zubale_2023.png" alt="Zubale" />
  <h1>Panel Admin — Chatbot</h1>
  <a class="back-link" href="postula.html">← Volver a la página</a>
</div>
<div id="app"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyznjxIn99mewSPEBf3rEMMsI_7mGneJo5rf3HT9gk_HhdKweUSM0m5vSgVHKKkN3gE/exec";
const ADMIN_PASS = "zubale2024";

let state = {
  loggedIn: false,
  tab: "metricas",
  metricas: null,
  registros: null,
  prompt: "",
  promptOriginal: "",
  saveStatus: "",
  loading: true,
};

function setState(partial) {
  Object.assign(state, partial);
  render();
}

async function gasPost(body) {
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(body),
  });
  return res.json();
}

async function gasGet(sheet) {
  const url = GAS_URL + (GAS_URL.includes("?") ? "&" : "?") + "sheet=" + sheet;
  const res = await fetch(url);
  return res.json();
}

async function loadData() {
  setState({ loading: true });
  try {
    const [metricas, registros, configRes] = await Promise.all([
      gasPost({ action: "leer_metricas" }),
      gasPost({ action: "leer_registros" }),
      gasPost({ action: "leer_config", clave: "system_prompt" }),
    ]);
    setState({
      metricas: Array.isArray(metricas) ? metricas : [],
      registros: Array.isArray(registros) ? registros : [],
      prompt: configRes.valor || "",
      promptOriginal: configRes.valor || "",
      loading: false,
    });
  } catch (e) {
    console.error("Error cargando datos:", e);
    setState({ metricas: [], registros: [], loading: false });
  }
}

async function savePrompt() {
  setState({ saveStatus: "guardando" });
  try {
    await gasPost({ action: "guardar_config", clave: "system_prompt", valor: state.prompt });
    setState({ saveStatus: "ok", promptOriginal: state.prompt });
    setTimeout(() => setState({ saveStatus: "" }), 3000);
  } catch (e) {
    setState({ saveStatus: "error" });
  }
}

function processMetrics(metricas) {
  const totalSessions = new Set(metricas.filter(m => m.tipo === "sesion_abierta").map(m => m.sesion)).size;
  const preguntas = metricas.filter(m => m.tipo === "pregunta");
  const totalPreguntas = preguntas.length;
  const rolesData = metricas.filter(m => m.tipo === "rol_consultado");
  const regIniciados = metricas.filter(m => m.tipo === "registro_iniciado").length;
  const regCompletados = metricas.filter(m => m.tipo === "registro_completado").length;

  const roleCount = {};
  rolesData.forEach(m => { roleCount[m.valor] = (roleCount[m.valor] || 0) + 1; });

  const questionFreq = {};
  preguntas.forEach(m => {
    const q = String(m.valor || "").toLowerCase().trim().slice(0, 80);
    if (q.length > 3) questionFreq[q] = (questionFreq[q] || 0) + 1;
  });
  const topQuestions = Object.entries(questionFreq).sort((a, b) => b[1] - a[1]).slice(0, 10);

  const hourCount = {};
  metricas.forEach(m => {
    if (m.tipo === "sesion_abierta" && m.fecha) {
      try {
        const h = new Date(m.fecha).getHours();
        hourCount[h] = (hourCount[h] || 0) + 1;
      } catch(e) {}
    }
  });

  const dayCount = {};
  metricas.forEach(m => {
    if (m.tipo === "sesion_abierta" && m.fecha) {
      try {
        const d = new Date(m.fecha).toISOString().slice(0, 10);
        dayCount[d] = (dayCount[d] || 0) + 1;
      } catch(e) {}
    }
  });
  const dailyLabels = Object.keys(dayCount).sort().slice(-14);
  const dailyValues = dailyLabels.map(d => dayCount[d] || 0);

  return {
    totalSessions,
    totalPreguntas,
    roleCount,
    topQuestions,
    hourCount,
    regIniciados,
    regCompletados,
    dailyLabels,
    dailyValues,
    tasaRegistro: totalSessions > 0 ? ((regCompletados / totalSessions) * 100).toFixed(1) : "0",
  };
}

let chartInstances = {};
function destroyCharts() {
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e) {} });
  chartInstances = {};
}

function renderCharts(stats) {
  destroyCharts();
  setTimeout(() => {
    const ctxRol = document.getElementById("chart-roles");
    if (ctxRol) {
      const labels = Object.keys(stats.roleCount);
      const values = Object.values(stats.roleCount);
      chartInstances.roles = new Chart(ctxRol, {
        type: "doughnut",
        data: {
          labels,
          datasets: [{ data: values, backgroundColor: ["#1557D6", "#FF6B35", "#10b981", "#8b5cf6"] }],
        },
        options: { responsive: true, plugins: { legend: { position: "bottom" } } },
      });
    }

    const ctxHour = document.getElementById("chart-hours");
    if (ctxHour) {
      const labels = [];
      const values = [];
      for (let h = 0; h < 24; h++) {
        labels.push(h + ":00");
        values.push(stats.hourCount[h] || 0);
      }
      chartInstances.hours = new Chart(ctxHour, {
        type: "bar",
        data: {
          labels,
          datasets: [{ label: "Sesiones", data: values, backgroundColor: "#1557D6", borderRadius: 4 }],
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
      });
    }

    const ctxDaily = document.getElementById("chart-daily");
    if (ctxDaily) {
      chartInstances.daily = new Chart(ctxDaily, {
        type: "line",
        data: {
          labels: stats.dailyLabels.map(d => d.slice(5)),
          datasets: [{ label: "Sesiones/día", data: stats.dailyValues, borderColor: "#1557D6", backgroundColor: "rgba(21,87,214,0.1)", fill: true, tension: 0.3 }],
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
      });
    }
  }, 50);
}

function render() {
  const app = document.getElementById("app");

  if (!state.loggedIn) {
    app.innerHTML = `
      <div class="login-screen">
        <div class="login-card">
          <h2>Acceso Admin</h2>
          <p>Ingresa la clave para acceder al panel</p>
          <div id="login-error" class="login-error" style="display:none"></div>
          <input type="password" id="pass-input" placeholder="Clave de acceso" />
          <button id="login-btn">Ingresar</button>
        </div>
      </div>
    `;
    document.getElementById("login-btn").onclick = () => {
      const val = document.getElementById("pass-input").value;
      if (val === ADMIN_PASS) {
        setState({ loggedIn: true });
        loadData();
      } else {
        const err = document.getElementById("login-error");
        err.textContent = "Clave incorrecta";
        err.style.display = "block";
      }
    };
    document.getElementById("pass-input").onkeydown = (e) => {
      if (e.key === "Enter") document.getElementById("login-btn").click();
    };
    setTimeout(() => document.getElementById("pass-input")?.focus(), 50);
    return;
  }

  if (state.loading) {
    app.innerHTML = '<div class="loading-state"><div class="spinner"></div><p style="margin-top:16px">Cargando datos...</p></div>';
    return;
  }

  const stats = processMetrics(state.metricas || []);

  let html = '<div class="dashboard">';
  html += '<div class="tabs">';
  html += '<button class="tab-btn' + (state.tab === "metricas" ? " active" : "") + '" data-tab="metricas">Metricas</button>';
  html += '<button class="tab-btn' + (state.tab === "registros" ? " active" : "") + '" data-tab="registros">Registros</button>';
  html += '<button class="tab-btn' + (state.tab === "prompt" ? " active" : "") + '" data-tab="prompt">Prompt</button>';
  html += '</div>';

  if (state.tab === "metricas") {
    html += '<div class="stats-grid">';
    html += '<div class="stat-card"><div class="stat-label">Total Conversaciones</div><div class="stat-value">' + stats.totalSessions + '</div></div>';
    html += '<div class="stat-card"><div class="stat-label">Preguntas Realizadas</div><div class="stat-value">' + stats.totalPreguntas + '</div></div>';
    html += '<div class="stat-card"><div class="stat-label">Registros Completados</div><div class="stat-value">' + stats.regCompletados + '</div><div class="stat-sub">De ' + stats.regIniciados + ' iniciados</div></div>';
    html += '<div class="stat-card"><div class="stat-label">Tasa de Registro</div><div class="stat-value">' + stats.tasaRegistro + '%</div></div>';
    html += '</div>';

    html += '<div class="charts-grid">';
    html += '<div class="chart-card"><h3>Rol mas consultado</h3><canvas id="chart-roles"></canvas></div>';
    html += '<div class="chart-card"><h3>Horarios pico</h3><canvas id="chart-hours"></canvas></div>';
    html += '</div>';

    html += '<div class="chart-card" style="margin-bottom:24px"><h3>Sesiones por dia (ultimos 14 dias)</h3><canvas id="chart-daily"></canvas></div>';

    html += '<div class="table-card"><h3>Preguntas mas frecuentes</h3>';
    if (stats.topQuestions.length > 0) {
      html += '<table><thead><tr><th>#</th><th>Pregunta</th><th>Veces</th></tr></thead><tbody>';
      stats.topQuestions.forEach(([q, c], i) => {
        html += '<tr><td>' + (i + 1) + '</td><td>' + escapeHtml(q) + '</td><td>' + c + '</td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<p style="color:var(--muted);padding:20px;text-align:center">Aún no hay preguntas registradas</p>';
    }
    html += '</div>';
  }

  if (state.tab === "registros") {
    const regs = state.registros || [];
    html += '<div class="stats-grid">';
    html += '<div class="stat-card"><div class="stat-label">Total Registros</div><div class="stat-value">' + regs.length + '</div></div>';
    const conApp = regs.filter(r => String(r.descargo_app || "").toLowerCase().includes("si")).length;
    html += '<div class="stat-card"><div class="stat-label">Descargaron App</div><div class="stat-value">' + conApp + '</div></div>';
    const seReg = regs.filter(r => String(r.se_registro || "").toLowerCase().includes("si")).length;
    html += '<div class="stat-card"><div class="stat-label">Se Registraron en App</div><div class="stat-value">' + seReg + '</div></div>';
    html += '</div>';

    html += '<div class="table-card"><h3>Registros recientes</h3>';
    if (regs.length > 0) {
      html += '<table><thead><tr><th>Fecha</th><th>Nombre</th><th>RUT</th><th>Telefono</th><th>App</th><th>Registro</th></tr></thead><tbody>';
      regs.slice().reverse().slice(0, 50).forEach(r => {
        const fecha = r.fecha ? new Date(r.fecha).toLocaleDateString("es-CL") : "";
        html += '<tr>';
        html += '<td>' + fecha + '</td>';
        html += '<td>' + escapeHtml(r.nombre || "") + '</td>';
        html += '<td>' + escapeHtml(r.rut || "") + '</td>';
        html += '<td>' + escapeHtml(r.telefono || "") + '</td>';
        html += '<td>' + escapeHtml(r.descargo_app || "") + '</td>';
        html += '<td>' + escapeHtml(r.se_registro || "") + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<p style="color:var(--muted);padding:20px;text-align:center">Aún no hay registros</p>';
    }
    html += '</div>';
  }

  if (state.tab === "prompt") {
    const changed = state.prompt !== state.promptOriginal;
    let statusHtml = "";
    if (state.saveStatus === "guardando") statusHtml = '<span class="save-status">Guardando...</span>';
    else if (state.saveStatus === "ok") statusHtml = '<span class="save-status">Guardado correctamente</span>';
    else if (state.saveStatus === "error") statusHtml = '<span class="save-error">Error al guardar</span>';

    html += '<div class="prompt-editor">';
    html += '<h3>System Prompt del Chatbot</h3>';
    html += '<p>Edita el prompt que usa Zubalin para responder. Los cambios se aplican inmediatamente a nuevas conversaciones. Si dejas este campo vacío, se usará el prompt por defecto del archivo chatbot-prompt.js.</p>';
    html += '<textarea id="prompt-textarea">' + escapeHtml(state.prompt) + '</textarea>';
    html += '<div class="prompt-actions">';
    html += '<button class="btn-primary" id="save-prompt-btn"' + (changed ? "" : " disabled") + '>Guardar</button>';
    html += '<button class="btn-secondary" id="reset-prompt-btn">Restaurar original</button>';
    html += statusHtml;
    html += '</div></div>';
  }

  html += '</div>';
  app.innerHTML = html;

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => {
      destroyCharts();
      setState({ tab: btn.dataset.tab });
      if (btn.dataset.tab === "metricas") {
        setTimeout(() => renderCharts(processMetrics(state.metricas || [])), 100);
      }
    };
  });

  if (state.tab === "metricas") {
    renderCharts(stats);
  }

  if (state.tab === "prompt") {
    const ta = document.getElementById("prompt-textarea");
    if (ta) {
      ta.oninput = () => { state.prompt = ta.value; render(); };
    }
    const saveBtn = document.getElementById("save-prompt-btn");
    if (saveBtn) saveBtn.onclick = savePrompt;
    const resetBtn = document.getElementById("reset-prompt-btn");
    if (resetBtn) resetBtn.onclick = () => {
      setState({ prompt: "", saveStatus: "" });
      savePrompt();
    };
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

render();
</script>
</body>
</html>
