<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel Admin — Zubale Chatbot</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue: #0B3BAA;
    --blue2: #1557D6;
    --blue-light: #1B4FFF;
    --orange: #FF6B35;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(11,59,170,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .topbar {
    background: linear-gradient(135deg, #0B3BAA 0%, #1557D6 55%, #1B4FFF 100%);
    color: #fff;
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }
  .topbar::before {
    content: "";
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
    pointer-events: none;
  }
  .topbar::after {
    content: "";
    position: absolute;
    bottom: -60px; left: 30%;
    width: 300px; height: 200px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .topbar img { height: 30px; position: relative; z-index: 1; }
  .topbar h1 { font-size: 17px; font-weight: 600; position: relative; z-index: 1; letter-spacing: -0.3px; }
  .topbar .back-link {
    color: #fff; text-decoration: none; font-size: 13px; font-weight: 500;
    margin-left: auto; position: relative; z-index: 1;
    background: rgba(255,255,255,0.15); padding: 6px 16px; border-radius: 8px;
    transition: background 0.2s;
  }
  .topbar .back-link:hover { background: rgba(255,255,255,0.25); }

  .login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - 64px);
    background: linear-gradient(180deg, #e8eef6 0%, var(--bg) 100%);
  }
  .login-card {
    background: var(--card); border-radius: var(--radius);
    padding: 48px 40px; max-width: 400px; width: 90%;
    box-shadow: var(--shadow); text-align: center;
  }
  .login-card .login-icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 24px; color: #fff;
  }
  .login-card h2 { margin-bottom: 6px; color: var(--blue); font-size: 22px; font-weight: 700; }
  .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .login-card input {
    width: 100%; padding: 14px 18px; border: 2px solid var(--border);
    border-radius: 12px; font-size: 15px; margin-bottom: 16px;
    font-family: inherit; transition: border-color 0.2s;
  }
  .login-card input:focus { outline: none; border-color: var(--blue2); }
  .login-card button {
    width: 100%; padding: 14px; font-family: inherit;
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
    color: #fff; border: none; border-radius: 12px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 4px 12px rgba(21,87,214,0.3);
  }
  .login-card button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(21,87,214,0.4); }
  .login-card button:active { transform: translateY(0); }
  .login-error { color: #dc2626; font-size: 13px; margin-bottom: 12px; font-weight: 500; }

  .dashboard { padding: 28px; max-width: 1240px; margin: 0 auto; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 28px;
    background: var(--card); border-radius: 14px; padding: 5px;
    box-shadow: var(--shadow);
  }
  .tab-btn {
    flex: 1; padding: 12px 16px; border: none; background: transparent;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
    color: var(--muted); transition: all 0.25s; font-family: inherit;
  }
  .tab-btn:hover { color: var(--blue2); background: rgba(21,87,214,0.05); }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
    color: #fff; box-shadow: 0 4px 12px rgba(21,87,214,0.25);
  }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow); border-left: 4px solid var(--blue2);
    transition: transform 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-card:nth-child(2) { border-left-color: var(--orange); }
  .stat-card:nth-child(3) { border-left-color: #10b981; }
  .stat-card:nth-child(4) { border-left-color: #8b5cf6; }
  .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .stat-value { font-size: 32px; font-weight: 800; color: var(--text); letter-spacing: -1px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .chart-card {
    background: var(--card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow);
  }
  .chart-card h3 { font-size: 14px; margin-bottom: 16px; color: var(--text); font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }

  .table-card {
    background: var(--card); border-radius: var(--radius); padding: 24px;
    box-shadow: var(--shadow); margin-bottom: 24px; overflow-x: auto;
  }
  .table-card h3 { font-size: 14px; margin-bottom: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
  .table-card table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table-card th {
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
    color: #fff; padding: 12px 16px; text-align: left; font-weight: 600;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .table-card th:first-child { border-radius: 10px 0 0 0; }
  .table-card th:last-child { border-radius: 0 10px 0 0; }
  .table-card td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .table-card tr:hover td { background: #f0f4ff; }
  .table-card tr:last-child td { border-bottom: none; }

  .prompt-editor {
    background: var(--card); border-radius: var(--radius); padding: 28px;
    box-shadow: var(--shadow); margin-bottom: 24px;
  }
  .prompt-editor h3 { font-size: 16px; margin-bottom: 8px; font-weight: 700; }
  .prompt-editor p { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
  .prompt-editor textarea {
    width: 100%; min-height: 400px; padding: 18px; border: 2px solid var(--border);
    border-radius: 12px; font-family: "Fira Code", "Consolas", monospace; font-size: 13px;
    line-height: 1.6; resize: vertical; transition: border-color 0.2s;
  }
  .prompt-editor textarea:focus { outline: none; border-color: var(--blue2); }
  .prompt-actions { display: flex; gap: 12px; margin-top: 20px; align-items: center; }
  .prompt-actions button {
    padding: 12px 28px; border: none; border-radius: 10px; font-size: 14px;
    font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
    color: #fff; box-shadow: 0 4px 12px rgba(21,87,214,0.25);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(21,87,214,0.35); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
  .btn-secondary { background: var(--bg); color: var(--text); border: 2px solid var(--border) !important; }
  .btn-secondary:hover { border-color: var(--blue2) !important; color: var(--blue2); }
  .save-status { font-size: 13px; color: #10b981; font-weight: 600; }
  .save-error { font-size: 13px; color: #dc2626; font-weight: 600; }

  .loading-state { text-align: center; padding: 80px; color: var(--muted); }
  .spinner {
    display: inline-block; width: 40px; height: 40px;
    border: 4px solid var(--border); border-top-color: var(--blue2);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center; padding: 48px 20px; color: var(--muted);
  }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state p { font-size: 14px; }

  @media (max-width: 768px) {
    .charts-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .dashboard { padding: 16px; }
    .topbar { padding: 0 16px; }
    .login-card { padding: 36px 28px; }
  }
  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="topbar">
  <img src="https://www.zubale.com/cl/wp-content/uploads/2023/12/logo_zubale_2023.png" alt="Zubale" />
  <h1>Panel Admin — Chatbot</h1>
  <a class="back-link" href="postula.html">← Volver a la pagina</a>
</div>
<div id="app"></div>

<script>
var GAS_URL = "https://script.google.com/macros/s/AKfycbyznjxIn99mewSPEBf3rEMMsI_7mGneJo5rf3HT9gk_HhdKweUSM0m5vSgVHKKkN3gE/exec";
var ADMIN_PASS = "zubale2024";

var state = {
  loggedIn: false,
  tab: "metricas",
  metricas: null,
  registros: null,
  prompt: "",
  promptOriginal: "",
  saveStatus: "",
  loading: true,
};

function setState(partial) {
  Object.assign(state, partial);
  render();
}

function gasPost(body) {
  return fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(body),
  }).then(function(r) { return r.json(); });
}

function loadData() {
  setState({ loading: true });
  Promise.all([
    gasPost({ action: "leer_metricas" }),
    gasPost({ action: "leer_registros" }),
    gasPost({ action: "leer_config", clave: "system_prompt" }),
  ]).then(function(results) {
    var metricas = results[0], registros = results[1], configRes = results[2];
    setState({
      metricas: Array.isArray(metricas) ? metricas : [],
      registros: Array.isArray(registros) ? registros : [],
      prompt: configRes.valor || "",
      promptOriginal: configRes.valor || "",
      loading: false,
    });
  }).catch(function(e) {
    console.error("Error cargando datos:", e);
    setState({ metricas: [], registros: [], loading: false });
  });
}

function savePrompt() {
  setState({ saveStatus: "guardando" });
  gasPost({ action: "guardar_config", clave: "system_prompt", valor: state.prompt })
    .then(function() {
      setState({ saveStatus: "ok", promptOriginal: state.prompt });
      setTimeout(function() { setState({ saveStatus: "" }); }, 3000);
    })
    .catch(function() { setState({ saveStatus: "error" }); });
}

function processMetrics(metricas) {
  var sessions = {};
  var preguntas = [];
  var rolesData = [];
  var regIniciados = 0;
  var regCompletados = 0;
  var hourCount = {};
  var dayCount = {};

  metricas.forEach(function(m) {
    if (m.tipo === "sesion_abierta") {
      sessions[m.sesion] = true;
      if (m.fecha) {
        try {
          var d = new Date(m.fecha);
          var h = d.getHours();
          hourCount[h] = (hourCount[h] || 0) + 1;
          var day = d.toISOString().slice(0, 10);
          dayCount[day] = (dayCount[day] || 0) + 1;
        } catch(e) {}
      }
    }
    if (m.tipo === "pregunta") preguntas.push(m);
    if (m.tipo === "rol_consultado") rolesData.push(m);
    if (m.tipo === "registro_iniciado") regIniciados++;
    if (m.tipo === "registro_completado") regCompletados++;
  });

  var totalSessions = Object.keys(sessions).length;
  var totalPreguntas = preguntas.length;

  var roleCount = {};
  rolesData.forEach(function(m) { roleCount[m.valor] = (roleCount[m.valor] || 0) + 1; });

  var questionFreq = {};
  preguntas.forEach(function(m) {
    var q = String(m.valor || "").toLowerCase().trim().slice(0, 80);
    if (q.length > 3) questionFreq[q] = (questionFreq[q] || 0) + 1;
  });
  var topQuestions = Object.entries(questionFreq).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 10);

  var dailyLabels = Object.keys(dayCount).sort().slice(-14);
  var dailyValues = dailyLabels.map(function(d) { return dayCount[d] || 0; });

  return {
    totalSessions: totalSessions,
    totalPreguntas: totalPreguntas,
    roleCount: roleCount,
    topQuestions: topQuestions,
    hourCount: hourCount,
    regIniciados: regIniciados,
    regCompletados: regCompletados,
    dailyLabels: dailyLabels,
    dailyValues: dailyValues,
    tasaRegistro: totalSessions > 0 ? ((regCompletados / totalSessions) * 100).toFixed(1) : "0",
  };
}

var chartInstances = {};
function destroyCharts() {
  Object.values(chartInstances).forEach(function(c) { try { c.destroy(); } catch(e) {} });
  chartInstances = {};
}

function renderCharts(stats) {
  destroyCharts();
  setTimeout(function() {
    var ctxRol = document.getElementById("chart-roles");
    if (ctxRol && Object.keys(stats.roleCount).length > 0) {
      var labels = Object.keys(stats.roleCount);
      var values = Object.values(stats.roleCount);
      chartInstances.roles = new Chart(ctxRol, {
        type: "doughnut",
        data: {
          labels: labels,
          datasets: [{ data: values, backgroundColor: ["#1557D6", "#FF6B35", "#10b981", "#8b5cf6"], borderWidth: 0 }],
        },
        options: { responsive: true, plugins: { legend: { position: "bottom", labels: { font: { family: "Inter", weight: "600" }, padding: 16 } } } },
      });
    }

    var ctxHour = document.getElementById("chart-hours");
    if (ctxHour) {
      var hLabels = [], hValues = [];
      for (var h = 0; h < 24; h++) {
        hLabels.push(h + ":00");
        hValues.push(stats.hourCount[h] || 0);
      }
      chartInstances.hours = new Chart(ctxHour, {
        type: "bar",
        data: {
          labels: hLabels,
          datasets: [{ label: "Sesiones", data: hValues, backgroundColor: "rgba(21,87,214,0.7)", borderRadius: 6, borderSkipped: false }],
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { family: "Inter" } } }, x: { ticks: { font: { family: "Inter", size: 10 } } } } },
      });
    }

    var ctxDaily = document.getElementById("chart-daily");
    if (ctxDaily && stats.dailyLabels.length > 0) {
      chartInstances.daily = new Chart(ctxDaily, {
        type: "line",
        data: {
          labels: stats.dailyLabels.map(function(d) { return d.slice(5); }),
          datasets: [{ label: "Sesiones/dia", data: stats.dailyValues, borderColor: "#1557D6", backgroundColor: "rgba(21,87,214,0.08)", fill: true, tension: 0.4, borderWidth: 3, pointBackgroundColor: "#1557D6", pointRadius: 4 }],
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { family: "Inter" } } }, x: { ticks: { font: { family: "Inter", size: 11 } } } } },
      });
    }
  }, 80);
}

function render() {
  var app = document.getElementById("app");

  if (!state.loggedIn) {
    app.innerHTML =
      '<div class="login-screen">' +
        '<div class="login-card">' +
          '<div class="login-icon">🔒</div>' +
          '<h2>Acceso Admin</h2>' +
          '<p>Ingresa la clave para acceder al panel de metricas</p>' +
          '<div id="login-error" class="login-error" style="display:none"></div>' +
          '<input type="password" id="pass-input" placeholder="Clave de acceso" />' +
          '<button id="login-btn">Ingresar</button>' +
        '</div>' +
      '</div>';
    document.getElementById("login-btn").onclick = function() {
      var val = document.getElementById("pass-input").value;
      if (val === ADMIN_PASS) {
        setState({ loggedIn: true });
        loadData();
      } else {
        var err = document.getElementById("login-error");
        err.textContent = "Clave incorrecta";
        err.style.display = "block";
      }
    };
    document.getElementById("pass-input").onkeydown = function(e) {
      if (e.key === "Enter") document.getElementById("login-btn").click();
    };
    setTimeout(function() { var el = document.getElementById("pass-input"); if (el) el.focus(); }, 50);
    return;
  }

  if (state.loading) {
    app.innerHTML = '<div class="loading-state"><div class="spinner"></div><p style="margin-top:20px;font-weight:500">Cargando datos...</p></div>';
    return;
  }

  var stats = processMetrics(state.metricas || []);
  var html = '<div class="dashboard">';

  html += '<div class="tabs">';
  html += '<button class="tab-btn' + (state.tab === "metricas" ? " active" : "") + '" data-tab="metricas">Metricas</button>';
  html += '<button class="tab-btn' + (state.tab === "registros" ? " active" : "") + '" data-tab="registros">Registros</button>';
  html += '<button class="tab-btn' + (state.tab === "prompt" ? " active" : "") + '" data-tab="prompt">Prompt</button>';
  html += '</div>';

  if (state.tab === "metricas") {
    html += '<div class="stats-grid">';
    html += '<div class="stat-card"><div class="stat-label">Total Conversaciones</div><div class="stat-value">' + stats.totalSessions + '</div></div>';
    html += '<div class="stat-card"><div class="stat-label">Preguntas Realizadas</div><div class="stat-value">' + stats.totalPreguntas + '</div></div>';
    html += '<div class="stat-card"><div class="stat-label">Registros Completados</div><div class="stat-value">' + stats.regCompletados + '</div><div class="stat-sub">De ' + stats.regIniciados + ' iniciados</div></div>';
    html += '<div class="stat-card"><div class="stat-label">Tasa de Registro</div><div class="stat-value">' + stats.tasaRegistro + '%</div></div>';
    html += '</div>';

    html += '<div class="charts-grid">';
    html += '<div class="chart-card"><h3>Rol mas consultado</h3>';
    if (Object.keys(stats.roleCount).length > 0) {
      html += '<canvas id="chart-roles"></canvas>';
    } else {
      html += '<div class="empty-state"><div class="empty-icon">📊</div><p>Sin datos aun</p></div>';
    }
    html += '</div>';
    html += '<div class="chart-card"><h3>Horarios pico</h3><canvas id="chart-hours"></canvas></div>';
    html += '</div>';

    html += '<div class="chart-card" style="margin-bottom:24px"><h3>Sesiones por dia (ultimos 14 dias)</h3>';
    if (stats.dailyLabels.length > 0) {
      html += '<canvas id="chart-daily"></canvas>';
    } else {
      html += '<div class="empty-state"><div class="empty-icon">📈</div><p>Sin datos aun</p></div>';
    }
    html += '</div>';

    html += '<div class="table-card"><h3>Preguntas mas frecuentes</h3>';
    if (stats.topQuestions.length > 0) {
      html += '<table><thead><tr><th>#</th><th>Pregunta</th><th>Veces</th></tr></thead><tbody>';
      stats.topQuestions.forEach(function(item, i) {
        html += '<tr><td>' + (i + 1) + '</td><td>' + escapeHtml(item[0]) + '</td><td><strong>' + item[1] + '</strong></td></tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<div class="empty-state"><div class="empty-icon">💬</div><p>Sin preguntas registradas aun</p></div>';
    }
    html += '</div>';
  }

  if (state.tab === "registros") {
    var regs = state.registros || [];
    html += '<div class="stats-grid">';
    html += '<div class="stat-card"><div class="stat-label">Total Registros</div><div class="stat-value">' + regs.length + '</div></div>';
    var conApp = regs.filter(function(r) { return String(r.descargo_app || "").toLowerCase().indexOf("si") !== -1; }).length;
    html += '<div class="stat-card"><div class="stat-label">Descargaron App</div><div class="stat-value">' + conApp + '</div></div>';
    var seReg = regs.filter(function(r) { return String(r.se_registro || "").toLowerCase().indexOf("si") !== -1; }).length;
    html += '<div class="stat-card"><div class="stat-label">Se Registraron en App</div><div class="stat-value">' + seReg + '</div></div>';
    html += '</div>';

    html += '<div class="table-card"><h3>Registros recientes</h3>';
    if (regs.length > 0) {
      html += '<table><thead><tr><th>Fecha</th><th>Nombre</th><th>RUT</th><th>Telefono</th><th>App</th><th>Registro</th></tr></thead><tbody>';
      regs.slice().reverse().slice(0, 50).forEach(function(r) {
        var fecha = r.fecha ? new Date(r.fecha).toLocaleDateString("es-CL") : "";
        html += '<tr>';
        html += '<td>' + fecha + '</td>';
        html += '<td>' + escapeHtml(r.nombre || "") + '</td>';
        html += '<td>' + escapeHtml(r.rut || "") + '</td>';
        html += '<td>' + escapeHtml(r.telefono || "") + '</td>';
        html += '<td>' + escapeHtml(r.descargo_app || "") + '</td>';
        html += '<td>' + escapeHtml(r.se_registro || "") + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    } else {
      html += '<div class="empty-state"><div class="empty-icon">📋</div><p>Sin registros aun</p></div>';
    }
    html += '</div>';
  }

  if (state.tab === "prompt") {
    var changed = state.prompt !== state.promptOriginal;
    var statusHtml = "";
    if (state.saveStatus === "guardando") statusHtml = '<span class="save-status">Guardando...</span>';
    else if (state.saveStatus === "ok") statusHtml = '<span class="save-status">Guardado correctamente</span>';
    else if (state.saveStatus === "error") statusHtml = '<span class="save-error">Error al guardar</span>';

    html += '<div class="prompt-editor">';
    html += '<h3>System Prompt del Chatbot</h3>';
    html += '<p>Edita el prompt que usa Zubalin para responder. Los cambios se aplican inmediatamente a nuevas conversaciones. Si dejas este campo vacio, se usara el prompt por defecto del archivo chatbot-prompt.js.</p>';
    html += '<textarea id="prompt-textarea">' + escapeHtml(state.prompt) + '</textarea>';
    html += '<div class="prompt-actions">';
    html += '<button class="btn-primary" id="save-prompt-btn"' + (changed ? "" : " disabled") + '>Guardar cambios</button>';
    html += '<button class="btn-secondary" id="reset-prompt-btn">Restaurar original</button>';
    html += statusHtml;
    html += '</div></div>';
  }

  html += '</div>';
  app.innerHTML = html;

  document.querySelectorAll(".tab-btn").forEach(function(btn) {
    btn.onclick = function() {
      destroyCharts();
      setState({ tab: btn.dataset.tab });
      if (btn.dataset.tab === "metricas") {
        setTimeout(function() { renderCharts(processMetrics(state.metricas || [])); }, 100);
      }
    };
  });

  if (state.tab === "metricas") renderCharts(stats);

  if (state.tab === "prompt") {
    var ta = document.getElementById("prompt-textarea");
    if (ta) ta.oninput = function() { state.prompt = ta.value; render(); };
    var saveBtn = document.getElementById("save-prompt-btn");
    if (saveBtn) saveBtn.onclick = savePrompt;
    var resetBtn = document.getElementById("reset-prompt-btn");
    if (resetBtn) resetBtn.onclick = function() {
      setState({ prompt: "", saveStatus: "" });
      savePrompt();
    };
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

render();
</script>
</body>
</html>
